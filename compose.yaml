name: coffee-platform

x-runtime-defaults: &runtime-defaults
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  user: "node"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
    - /run/secrets:rw,noexec,nosuid,nodev
  environment: &runtime-environment
    COFFEE_CONFIG_FILE: /app/config/platform.yaml
    COFFEE_RUNTIME_SECRETS_FILE: /run/secrets/coffee-platform.yaml
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_RESOURCE_ATTRIBUTES: service.namespace=coffee-platform,deployment.environment=development
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  healthcheck: &runtime-healthcheck
    test:
      - CMD-SHELL
      - node -e "import('@coffee-platform/runtime/healthcheck').then(({main}) => main(process.argv.slice(1)))" /health/ready
    interval: 5s
    timeout: 1s
    start_period: 30s
    retries: 3

services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: SASL_SSL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEY_CREDENTIALS: kafka.keystore.password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka.keystore.password
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka.keystore.password
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/kafka:/etc/kafka/secrets:ro
      - kafka_data:/var/lib/kafka/data
    networks:
      - coffee_kafka_event
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  edge-gateway:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: edge-gateway
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: edge-gateway
      PORT: "4000"
      OTEL_SERVICE_NAME: edge-gateway
    ports:
      - target: 4000
        published: "4000"
        host_ip: 127.0.0.1
        protocol: tcp
    expose:
      - "4000"
    networks:
      coffee_host_ingress:
      coffee_public_ingress:
      coffee_edge_backend:
    secrets:
      - source: runtime-edge-gateway
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  api-public:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: api-public
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: api-public
      PORT: "4050"
      OTEL_SERVICE_NAME: api-public
    expose:
      - "4050"
    networks:
      - coffee_edge_backend
      - coffee_public_api_backend
    depends_on:
      customer-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    secrets:
      - source: runtime-api-public
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  api-internal:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: api-internal
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: api-internal
      PORT: "4051"
      OTEL_SERVICE_NAME: api-internal
    expose:
      - "4051"
    networks:
      - coffee_internal_api
    secrets:
      - source: runtime-api-internal
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  web:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: web
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: web
      PORT: "3000"
      OTEL_SERVICE_NAME: web
    expose:
      - "3000"
    networks:
      - coffee_public_ingress
    secrets:
      - source: runtime-web
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  customer-service:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: customer-service
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: customer-service
      PORT: "4101"
      OTEL_SERVICE_NAME: customer-service
    expose:
      - "4101"
    networks:
      - coffee_public_api_backend
      - coffee_internal_api
      - coffee_postgres_data
    secrets:
      - source: runtime-customer-service
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  catalog-service:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: catalog-service
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: catalog-service
      PORT: "4102"
      OTEL_SERVICE_NAME: catalog-service
    expose:
      - "4102"
    networks:
      - coffee_public_api_backend
      - coffee_internal_api
      - coffee_postgres_data
    secrets:
      - source: runtime-catalog-service
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  catalog-supplier-sync:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: catalog-supplier-sync
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: catalog-supplier-sync
      PORT: "4201"
      OTEL_SERVICE_NAME: catalog-supplier-sync
    expose:
      - "4201"
    networks:
      - coffee_internal_api
      - coffee_postgres_data
    depends_on:
      api-internal:
        condition: service_healthy
    secrets:
      - source: runtime-catalog-supplier-sync
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  catalog-activation-worker:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: catalog-activation-worker
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: catalog-activation-worker
      PORT: "4202"
      OTEL_SERVICE_NAME: catalog-activation-worker
    expose:
      - "4202"
    networks:
      - coffee_postgres_data
      - coffee_kafka_event
      - coffee_internal_api
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-catalog-activation-worker
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  pricing-service:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: pricing-service
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: pricing-service
      PORT: "4103"
      OTEL_SERVICE_NAME: pricing-service
    expose:
      - "4103"
    networks:
      - coffee_public_api_backend
      - coffee_internal_api
      - coffee_postgres_data
    secrets:
      - source: runtime-pricing-service
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  orders-service:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: orders-service
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: orders-service
      PORT: "4104"
      OTEL_SERVICE_NAME: orders-service
    expose:
      - "4104"
    networks:
      - coffee_public_api_backend
      - coffee_internal_api
      - coffee_postgres_data
      - coffee_kafka_event
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-orders-service
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  orders-aroma-preparation:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: orders-aroma-preparation
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: orders-aroma-preparation
      PORT: "4203"
      OTEL_SERVICE_NAME: orders-aroma-preparation
    expose:
      - "4203"
    networks:
      - coffee_postgres_data
      - coffee_kafka_event
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-orders-aroma-preparation
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  aroma-observer:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: aroma-observer
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: aroma-observer
      PORT: "4204"
      OTEL_SERVICE_NAME: aroma-observer
