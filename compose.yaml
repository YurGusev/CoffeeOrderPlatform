      - coffee_kafka_event
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-aroma-observer
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  aroma-convergence:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: aroma-convergence
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: aroma-convergence
      PORT: "4205"
      OTEL_SERVICE_NAME: aroma-convergence
    expose:
      - "4205"
    networks:
      - coffee_internal_api
      - coffee_postgres_data
      - coffee_kafka_event
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-aroma-convergence
        target: /run/secrets/coffee-platform.yaml
