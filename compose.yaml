        gid: "1000"
        mode: 0400

  aroma-gateway:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: aroma-gateway
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: aroma-gateway
      PORT: "4301"
      OTEL_SERVICE_NAME: aroma-gateway
    expose:
      - "4301"
    networks:
      - coffee_internal_api
      - coffee_postgres_data
      - coffee_provider_egress
    secrets:
      - source: runtime-aroma-gateway
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

  realtime-gateway:
    <<: *runtime-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME: realtime-gateway
    environment:
      <<: *runtime-environment
      RUNTIME_NAME: realtime-gateway
      PORT: "4401"
      OTEL_SERVICE_NAME: realtime-gateway
    expose:
      - "4401"
    networks:
      - coffee_edge_backend
      - coffee_kafka_event
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: runtime-realtime-gateway
        target: /run/secrets/coffee-platform.yaml
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  runtime-edge-gateway:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/edge-gateway.yaml
  runtime-api-public:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/api-public.yaml
  runtime-api-internal:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/api-internal.yaml
  runtime-web:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/web.yaml
  runtime-customer-service:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/customer-service.yaml
  runtime-catalog-service:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/catalog-service.yaml
  runtime-catalog-supplier-sync:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/catalog-supplier-sync.yaml
  runtime-catalog-activation-worker:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/catalog-activation-worker.yaml
  runtime-pricing-service:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/pricing-service.yaml
  runtime-orders-service:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/orders-service.yaml
  runtime-orders-aroma-preparation:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/orders-aroma-preparation.yaml
  runtime-aroma-observer:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/aroma-observer.yaml
  runtime-aroma-convergence:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/aroma-convergence.yaml
  runtime-aroma-gateway:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/aroma-gateway.yaml
  runtime-realtime-gateway:
    file: ${COFFEE_COMPOSE_SECRETS_DIR:-/dev/shm/coffee-platform-secrets}/realtime-gateway.yaml

networks:
  coffee_host_ingress:
    name: coffee_host_ingress
    internal: false
  coffee_public_ingress:
    name: coffee_public_ingress
    internal: true
  coffee_edge_backend:
    name: coffee_edge_backend
    internal: true
  coffee_public_api_backend:
    name: coffee_public_api_backend
    internal: true
  coffee_internal_api:
    name: coffee_internal_api
    internal: true
  coffee_postgres_data:
    name: coffee_postgres_data
    external: true
  coffee_kafka_event:
    name: coffee_kafka_event
    internal: true
  coffee_provider_egress:
    name: coffee_provider_egress
    internal: false

volumes:
  kafka_data:
