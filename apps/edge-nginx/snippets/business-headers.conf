proxy_pass_request_headers off;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Correlation-Id $edge_auth_correlation;
proxy_set_header traceparent $http_traceparent;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header If-Match $http_if_match;
proxy_set_header If-Match-Version $http_if_match_version;
proxy_set_header Idempotency-Replay-Only $http_idempotency_replay_only;
proxy_set_header Content-Length $content_length;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection '';
