proxy_ssl_trusted_certificate /run/secrets/edge-nginx/upstream-ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
proxy_ssl_certificate /run/secrets/edge-nginx/client.crt;
proxy_ssl_certificate_key /run/secrets/edge-nginx/client.key;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
