name: Проверка совместимости Effect authority

on:
  pull_request:
    paths:
      - "platform/runtime-foundation-decision*.json"
      - "config/toolchain-versions*.json"
      - "scripts/run-effect-authority-probes.mjs"
      - ".github/workflows/effect-authority-compatibility.yml"
      - "docs/adr/ADR-0023-effect-native-platform.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-authority-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: effect_probe
          POSTGRES_PASSWORD: effect_probe_password
          POSTGRES_DB: effect_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U effect_probe -d effect_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Получить exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Установить Node 26.8.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          check-latest: false

      - name: Зафиксировать npm 11.19.0
        run: npm install --global --no-audit --no-fund npm@11.19.0

      - name: Выполнить Effect compatibility probes
        env:
          DATABASE_URL: postgresql://effect_probe:effect_probe_password@127.0.0.1:5432/effect_probe
          EFFECT_PROBE_EVIDENCE: ${{ runner.temp }}/effect-authority-probe-result.json
        run: node scripts/run-effect-authority-probes.mjs

      - name: Опубликовать сводку evidence
        if: always()
        shell: bash
        run: |
          if [[ -f "${{ runner.temp }}/effect-authority-probe-result.json" ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ runner.temp }}/effect-authority-probe-result.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
