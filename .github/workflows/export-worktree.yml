name: Временный экспорт рабочей копии

on:
  push:
    branches:
      - feature/26-effect-toolchain-guards
    paths:
      - ".github/workflows/export-worktree.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Получить exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Упаковать рабочую копию
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --create --gzip --file "${RUNNER_TEMP}/coffee-order-platform.tar.gz" .

      - name: Опубликовать временный артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coffee-order-platform-${{ github.sha }}
          path: ${{ runner.temp }}/coffee-order-platform.tar.gz
          if-no-files-found: error
          retention-days: 1
