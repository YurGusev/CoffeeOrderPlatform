name: Зафиксировать lockfile Effect toolchain

on:
  pull_request:
    branches: [develop]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "config/toolchain-versions*.json"
      - ".github/workflows/effect-toolchain-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: effect-toolchain-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/26-effect-toolchain-guards'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Установить Node 26.8.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          check-latest: false

      - name: Установить exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.24.0
          test "$(pnpm --version)" = "11.24.0"

      - name: Сформировать lockfile без lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          before_workspace="$(sha256sum pnpm-workspace.yaml | cut -d' ' -f1)"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          after_workspace="$(sha256sum pnpm-workspace.yaml | cut -d' ' -f1)"
          test "$before_workspace" = "$after_workspace"
          grep -F "effect@4.0.0-rc.112" pnpm-lock.yaml >/dev/null
          grep -F "@effect/tsgo@0.39.0" pnpm-lock.yaml >/dev/null
          grep -F "@effect/vitest@4.0.0-rc.112" pnpm-lock.yaml >/dev/null

      - name: Закоммитить lockfile и удалить временный workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/effect-toolchain-lockfile.yml
          git diff --cached --check
          git commit -m "Зафиксировать lockfile Effect toolchain"
          git push origin "HEAD:${HEAD_BRANCH}"
