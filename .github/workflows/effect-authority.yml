name: Проверка Effect authority

on:
  pull_request:
    paths:
      - "platform/runtime-foundation-decision*.json"
      - "config/toolchain-versions*.json"
      - "scripts/validate-effect-authority.py"
      - "scripts/validate-effect-toolchain-target.py"
      - "scripts/validate-launch-authority.py"
      - "tests/authority/**"
      - "docs/adr/ADR-0023-effect-native-platform.md"
      - "docs/launch/13_DELIVERY_DEPENDENCY_GRAPH.md"
      - "docs/launch/26_EFFECT_NATIVE_FOUNDATION.md"
      - "AGENTS.md"
      - ".github/workflows/effect-authority.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Проверить Effect-native machine authority
        run: |
          python3 scripts/validate-effect-authority.py
          python3 scripts/validate-effect-toolchain-target.py

      - name: Выполнить positive/negative authority tests
        run: python3 -m unittest discover -s tests/authority -p 'test_*.py' -v

      - name: Проверить формат diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          else
            git diff --check HEAD^...HEAD
          fi
