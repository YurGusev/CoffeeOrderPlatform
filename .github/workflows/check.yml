name: check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Runner стоит на dev-machine. Чужой код туда не пускаем:
    # запуск только от владельца и только для develop
    # или PR в develop из этого же репозитория.
    if: >-
      github.actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, coffee-local]
    # До 120 минут ожидания общего ресурса + прежние 30 минут работы.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          # pnpm contracts:breaking сравнивает контракты с origin/develop.
          fetch-depth: 0
          persist-credentials: false
      - name: Install and pnpm check
        run: |
          resource_lock="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/coffee-platform-heavy.lock"
          (umask 077; : >> "$resource_lock")
          queued_at=$EPOCHSECONDS
          printf 'Waiting for shared heavy resource\n'
          exec flock --no-fork --wait 7200 "$resource_lock" \
            timeout --signal=TERM --kill-after=90s 1800s \
            bash -euo pipefail -c '
              printf "Resource acquired after %ss\n" "$((EPOCHSECONDS - $1))"
              pnpm install --frozen-lockfile
              pnpm check
            ' coffee-ci "$queued_at"
