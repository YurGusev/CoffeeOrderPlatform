name: check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Runner стоит на dev-machine. Чужой код туда не пускаем:
    # запуск только от владельца и только для develop
    # или PR в develop из этого же репозитория.
    if: >-
      github.actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, coffee-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # pnpm contracts:breaking сравнивает контракты с origin/develop.
          fetch-depth: 0
          persist-credentials: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: pnpm check
        run: pnpm check
