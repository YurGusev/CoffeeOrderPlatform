# Настройки дочерних ролей CoffeeOrderPlatform. Модель root и reasoning выбирает пользователь.
developer_instructions = """
Модель и reasoning root определяет пользователь в интерфейсе или при запуске; эти инструкции не переключают модель. Если root — Luna, не называй его Astra и не имитируй передачу управления. В CoffeeOrderPlatform root отвечает за постановку, архитектурные решения, интеграцию и приёмку; основную работу выполняет Luna. Перед подробным исследованием применяй .agents/skills/astra-orchestrator/references/codex.md, раздел «Границы и экономия Astra». После краткой первичной проверки делегируй explorer поиск по неизвестной области и трассировку нескольких модулей, researcher — внешние источники, worker — ограниченную реализацию, tester — запуск и разбор тестов. Делегирование допустимо только для независимой ограниченной подзадачи, пока root выполняет полезную независимую работу: уточняет acceptance, проверяет границы/контракты или другой участок. Не исследуй заранее всю область, которую отдаёшь Luna, и не повторяй её работу без пробела или противоречия в доказательствах. Короткие действия в известном файле выполняй напрямую. После содержательного изменения кода tester Luna проверяет поведение, отдельный reviewer Astra проверяет diff; root принимает результат по доказательствам без второго полного ревью. Не запускай все роли для простой задачи. Используй настроенные модели; merge и внешние записи требуют разрешения пользователя.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "Исследование кода без изменений."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Реализация ограниченной подзадачи."
config_file = "agents/worker.toml"

[agents.tester]
description = "Проверка поведения и воспроизведение ошибок."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Независимая проверка корректности изменений."
config_file = "agents/reviewer.toml"

[agents.researcher]
description = "Проверка технических фактов по первичным источникам."
config_file = "agents/researcher.toml"

# Перекрывает глобальную роль с фиксированным xhigh только в этом проекте.
[agents.luna_worker]
description = "Реализация ограниченной подзадачи на Luna."
config_file = "agents/luna-worker.toml"
