version: 2
productionRules:
  autoCreateTopics: false
  criticalReplicationFactor: 3
  criticalMinInSyncReplicas: 2
  productionPartitionsMustBeExplicit: true
  partitionCountLockedAfterCutover: true
  defaultApplicationMaxSerializedBytes: 262144
  wireInt64: decimal-string
  realtimeInvalidationModel: direct-bounded-context-outbox
topics:
- name: coffee.channels.inbound.v1
  kind: event
  owner: channel-platform
  key: ConversationKeyHash
  retentionClass: TIER_A_INGRESS
  durabilityClass: critical
  productionPartitions: 24
  productionRetentionHours: 168
  producers:
  - channel-ingress
  consumerGroups:
  - channel-intake
  schema: integration-event-envelope.schema.json
  payloadSchemas:
  - payload-schemas/channel-message-received.v1.schema.json
  piiClass: user-generated-content-possible-pii
  replayPolicy: business-ingress-controlled
  drClass: tier-a
- name: coffee.agent.turn.requested.v1
  kind: command
  owner: agent-platform
  key: ConversationKeyHash
  retentionClass: ASYNC_COMMAND
  durabilityClass: critical
  productionPartitions: 24
  productionRetentionHours: 168
  producers:
  - channel-intake
  consumerGroups:
  - hermes-dispatcher
  schema: integration-command-envelope.schema.json
  payloadSchemas:
  - payload-schemas/agent-turn-requested.v1.schema.json
  piiClass: user-generated-content-possible-pii
  replayPolicy: command-idempotent-controlled
  drClass: tier-a
- name: coffee.agent.turn.completed.v1
  kind: event
  owner: agent-platform
  key: ConversationKeyHash
  retentionClass: DOMAIN_LIFECYCLE
  durabilityClass: critical
  productionPartitions: 24
  productionRetentionHours: 168
  producers:
  - hermes-dispatcher
  consumerGroups:
  - channel-response-mapper
  - agent-telemetry
  schema: integration-event-envelope.schema.json
  payloadSchemas:
  - payload-schemas/agent-turn-completed.v1.schema.json
  piiClass: user-generated-content-possible-pii
  replayPolicy: projection-safe
  drClass: standard
- name: coffee.agent.turn.failed.v1
  kind: event
  owner: agent-platform
  key: ConversationKeyHash
  retentionClass: DELIVERY_AUDIT
  durabilityClass: critical
  productionPartitions: 12
  productionRetentionHours: 168
  producers:
  - hermes-dispatcher
  consumerGroups:
  - channel-response-mapper
  - agent-operations
  schema: integration-event-envelope.schema.json
  payloadSchemas:
  - payload-schemas/agent-turn-failed.v1.schema.json
  piiClass: user-generated-content-possible-pii
  replayPolicy: terminal-fallback-and-ops
  drClass: standard
- name: coffee.channels.outbound.v1
  kind: command
  owner: channel-platform
  key: ConversationKeyHash
  retentionClass: ASYNC_COMMAND
  durabilityClass: critical
  productionPartitions: 24
  productionRetentionHours: 168
  producers:
