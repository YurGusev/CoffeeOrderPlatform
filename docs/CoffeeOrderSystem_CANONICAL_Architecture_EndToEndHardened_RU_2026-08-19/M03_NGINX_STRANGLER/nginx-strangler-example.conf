# ИЛЛЮСТРАТИВНЫЙ пример M03+M19, не production-ready конфигурация.
# Public edge знает только public client-v1, realtime и exact provider callbacks.
map $catalog_backend_target $catalog_upstream {
    default  http://legacy-api:8080;
    platform http://api-public:3000;
}

server {
    listen 80;

    location ^~ /app/ {
        proxy_pass http://platform-web;
    }

    location ^~ /api/client-v1/products/ {
        proxy_pass $catalog_upstream;
    }

    location = /events {
        proxy_pass http://realtime-gateway:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /channels/vk/callback {
        client_max_body_size 1m;
        proxy_pass http://channel-ingress:3000;
    }

    location = /webhooks/payments/yookassa {
        client_max_body_size 1m;
        proxy_pass http://payments-webhook:3000;
    }

    # Defense in depth: private surfaces never proxy from public edge.
    location ^~ /api/agent-v1/ { return 404; }
    location ^~ /api/internal-v1/ { return 404; }
}
