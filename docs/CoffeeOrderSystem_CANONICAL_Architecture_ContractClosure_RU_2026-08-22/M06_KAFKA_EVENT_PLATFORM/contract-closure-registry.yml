version: 1
authority: additive-closure
baseline:
  canonicalRelease: CoffeeOrderSystem_CANONICAL_Architecture_EndToEndHardened_RU_2026-08-19
  topicRegistry: M06_KAFKA_EVENT_PLATFORM/kafka-topic-registry.yml
  runtimeWorkloadRegistry: M20_SERVICE_ORCHESTRATION/runtime-workload-registry.yml
revision:
  topicRegistry: kafka-topic-registry.delta.yml
  messageSchemaRegistry: message-schema-registry.delta.yml
  workloadRegistry: ../M20_SERVICE_ORCHESTRATION/runtime-workload-registry.delta.yml
materialization:
  topicMergeKey: name
  groupMergeKey:
  - topic
  - consumerGroup
  bindingKey:
  - topic
  - consumerGroup
  producerRule: producerRef-must-exist-in-roleCatalog-and-be-executable
  consumerRule: one-exact-roleRef-for-each-topic-consumerGroup
  missingConsumesTopicsRule: derive-only-from-this-registry-binding; never-from-empty-baseline-field
  crossTopicGroupRule: allow-only-when-roleCatalog-documents-canonical-multi-topic-projection
  undeclaredInteractionRule: reject-if-no-M20-allowed-edge-or-topic-binding
  logicalProducerScope:
    status: authority-gap
    unresolvedRoleRefs:
    - orders
    - catalog
    - payments
    - customer
    - invoices
    - platform-notifications
    runtimeEvidence: excluded
    runtimeRoleCount: excluded
    resolution: materialize-audited-runtime-role-before-runtime-claim
  unresolvedProducerRule: retain-declared-binding-and-report-authority-gap
artifactRefPolicy:
  mediaAndTranscription:
    transport: artifact-storage
    kafkaPayload: ArtifactRef-only
    bytesField: forbidden
    requiredArtifactRefFields:
    - artifactRef
    - ownerContext
    - artifactType
    - schemaVersion
    - sha256
    - byteSize
    - contentType
    - createdAtUtc
