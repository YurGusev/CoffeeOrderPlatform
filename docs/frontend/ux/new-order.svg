<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Макет создания черновика заказа</title>
  <desc id="desc">Экран до появления заказа: выбранный клиент, создание черновика, отсутствие или ошибка ссылки клиента, загрузка, известная ошибка и восстановление потерянного ответа.</desc>
  <defs>
    <style>
      text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1A1D23; }
      .body { font-size: 14px; } .label { font-size: 12px; font-weight: 500; } .muted { fill: #5B6472; }
      .heading { font-size: 20px; font-weight: 600; } .section { font-size: 16px; font-weight: 600; }
      .mono { font-family: ui-monospace, monospace; font-size: 12px; }
      .panel { fill: #FFFFFF; stroke: #DDE1E7; } .surface { fill: #F7F8FA; }
      .primary { fill: #3355D1; } .primaryText { fill: #FFFFFF; font-weight: 600; }
      .danger { fill: #FEF2F2; stroke: #FCA5A5; } .dangerText { fill: #B91C1C; }
      .warning { fill: #FFFBEB; stroke: #F59E0B; } .warningText { fill: #92400E; }
      .success { fill: #ECFDF3; stroke: #86EFAC; } .successText { fill: #166534; }
      .focus { fill: none; stroke: #1D4ED8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="940" fill="#FFFFFF"/>
  <rect width="1440" height="88" class="surface"/>
  <text x="32" y="42" class="heading">Новый заказ</text>
  <text x="32" y="68" class="body muted">Сначала создайте черновик для выбранного клиента</text>
  <rect x="1204" y="24" width="204" height="40" rx="6" class="panel"/>
  <text x="1234" y="49" class="body">← К списку клиентов</text>

  <rect x="32" y="120" width="860" height="272" rx="6" class="panel"/>
  <text x="56" y="158" class="section">Выбранный клиент</text>
  <text x="56" y="194" class="label muted">КЛИЕНТ</text>
  <text x="56" y="224" class="body" font-weight="600">Марина Соколова</text>
  <text x="56" y="250" class="mono muted">customerRef: cus_01J8N7C4M2K6Q9R3T5V7X1Z0AB</text>
  <rect x="724" y="184" width="136" height="40" rx="6" class="panel"/>
  <text x="754" y="209" class="body">Сменить</text>
  <rect x="56" y="286" width="804" height="74" rx="6" class="warning"/>
  <text x="80" y="316" class="body warningText" font-weight="600">Клиента проверит сервис заказов</text>
  <text x="80" y="340" class="body warningText">До успешного создания черновика номер заказа ещё не существует.</text>

  <rect x="920" y="120" width="488" height="272" rx="6" class="surface" stroke="#DDE1E7"/>
  <text x="944" y="158" class="section">Создание</text>
  <text x="944" y="194" class="body">Будет создан пустой черновик заказа.</text>
  <text x="944" y="220" class="body muted">Товары и подтверждение доступны после создания.</text>
  <rect x="944" y="260" width="440" height="48" rx="6" class="primary"/>
  <text x="1080" y="290" class="body primaryText">Создать черновик</text>
  <rect x="942" y="258" width="444" height="52" rx="7" class="focus"/>
  <text x="944" y="342" class="label muted">Кнопка заблокирована до ответа.</text>

  <text x="32" y="442" class="section">Ошибки до отправки команды</text>
  <rect x="32" y="462" width="668" height="168" rx="6" class="danger"/>
  <text x="56" y="496" class="label dangerText">КЛИЕНТ НЕ ВЫБРАН</text>
  <text x="56" y="530" class="section dangerText">Выберите клиента</text>
  <text x="56" y="558" class="body dangerText">Без клиента создать черновик нельзя.</text>
  <rect x="56" y="578" width="188" height="40" rx="6" fill="#FFFFFF" stroke="#B91C1C"/>
  <text x="78" y="603" class="body dangerText">Выбрать клиента</text>

  <rect x="724" y="462" width="684" height="168" rx="6" class="danger"/>
  <text x="748" y="496" class="label dangerText">НЕВЕРНАЯ ССЫЛКА КЛИЕНТА</text>
  <text x="748" y="530" class="section dangerText">Не удалось распознать выбранного клиента</text>
  <text x="748" y="558" class="body dangerText">Вернитесь к поиску и выберите клиента снова.</text>
  <rect x="748" y="578" width="188" height="40" rx="6" fill="#FFFFFF" stroke="#B91C1C"/>
  <text x="770" y="603" class="body dangerText">К поиску клиентов</text>

  <text x="32" y="680" class="section">Состояния отправленной команды</text>
  <rect x="32" y="700" width="416" height="188" rx="6" class="surface" stroke="#DDE1E7"/>
  <text x="56" y="734" class="label muted">СОЗДАНИЕ</text>
  <circle cx="74" cy="774" r="10" fill="none" stroke="#3355D1" stroke-width="3" stroke-dasharray="16 8"/>
  <text x="100" y="779" class="section">Создаём черновик…</text>
  <text x="56" y="818" class="body muted">Кнопка занята только этой командой.</text>
  <text x="56" y="844" class="body muted">После успеха откроется карточка заказа.</text>

  <rect x="472" y="700" width="416" height="188" rx="6" class="danger"/>
  <text x="496" y="734" class="label dangerText">ИЗВЕСТНАЯ ОШИБКА</text>
  <text x="496" y="770" class="section dangerText">Черновик не создан</text>
  <text x="496" y="798" class="body dangerText">Выбранный клиент недоступен.</text>
  <text x="496" y="824" class="body dangerText">Сообщите код: 6b0c…</text>
  <rect x="496" y="840" width="172" height="36" rx="6" fill="#FFFFFF" stroke="#B91C1C"/>
  <text x="518" y="863" class="body dangerText">Сменить клиента</text>

  <rect x="912" y="700" width="496" height="188" rx="6" class="warning"/>
  <text x="936" y="734" class="label warningText">ОТВЕТ ПОТЕРЯН</text>
  <text x="936" y="770" class="section warningText">Результат создания неизвестен</text>
  <text x="936" y="798" class="body warningText">Не создавайте второй черновик, пока идёт проверка.</text>
  <rect x="936" y="832" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#92400E"/>
  <text x="962" y="859" class="body warningText">Проверить результат</text>
  <text x="1160" y="850" class="body warningText">При успехе откроется</text>
  <text x="1160" y="872" class="body warningText">карточка заказа.</text>

  <text x="32" y="922" class="label muted">ПРИМЕР СОСТОЯНИЙ · ДАННЫЕ ВЫМЫШЛЕНЫ · ДО СОЗДАНИЯ ЧЕРНОВИКА НЕТ НОМЕРА ЗАКАЗА</text>
</svg>
