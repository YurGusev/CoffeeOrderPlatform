version: 1
gates:
  - id: preflight
    version: 1
    profile: both
    mandatory: true
    owner: Platform
    predecessors: []
    command: pnpm launch:verify:preflight
    timeout: 900
    inputs: [cleanSourceSha, candidateSha, githubSnapshot]
    expectedArtifacts:
      [result.json, stdout.log, stderr.log, artifacts/preflight.json]
    passCriteria: чистый SHA; принятые GitHub PR/handoff #14/#19/#2–#12/#16–#18/#60–#64/#210; точная authority-репозитория; без цели legacy DB
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: install
    version: 1
    profile: both
    mandatory: true
    owner: Platform
    predecessors: [preflight]
    command: pnpm install --frozen-lockfile
    timeout: 900
    inputs: [lockfile]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: lockfile не меняется; lifecycle/network действия только в allowlist
    cleanup: candidate-checkout-only
    rerunPolicy: new-run-id-only
  - id: generated
    version: 1
    profile: both
    mandatory: true
    owner: Contracts
    predecessors: [install]
    command: pnpm contracts:check-generated
    timeout: 900
    inputs: [generated-sources]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: generated tree побайтно совпадает; drift отсутствует
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: static
    version: 1
    profile: both
    mandatory: true
    owner: Platform
    predecessors: [generated]
    command: pnpm format:check && pnpm lint && pnpm typecheck
    timeout: 900
    inputs: [source-tree]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: все команды завершаются с кодом 0; warnings budget равен 0
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: unit
    version: 1
    profile: both
    mandatory: true
    owner: Domain owners
    predecessors: [static]
    command: pnpm test:unit -- --coverage
    timeout: 900
    inputs: [source-tree]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: код выхода 0; изменённые критические модули выполняют объявленные thresholds
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: contracts
    version: 1
    profile: both
    mandatory: true
    owner: Contracts
    predecessors: [static]
    command: pnpm contracts:check-generated && pnpm contracts:breaking && pnpm contracts:test
    timeout: 900
    inputs: [contracts, fixtures]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: positive/negative fixtures проходят; breaking change не одобренных контрактов отсутствуют
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: architecture
    version: 1
    profile: both
    mandatory: true
    owner: Architecture
    predecessors: [contracts]
    command: pnpm architecture:check
    timeout: 900
    inputs: [source-tree]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: все GREEN проходят; каждый RED показывает source/target/rule
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: config_security
    version: 1
    profile: both
    mandatory: true
    owner: Security
    predecessors: [contracts]
    command: pnpm versions:check && pnpm config:check && pnpm security:secrets
    timeout: 900
    inputs: [pins, config, encrypted-secrets]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: точные pins/SOPS/scopes/redaction; plaintext/canary утечек нет
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: supply_chain
    version: 1
    profile: release
    mandatory: true
    owner: Security
    predecessors: [config_security]
    command: pnpm security:scan
    timeout: 2700
    inputs: [lockfile, build-provenance]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: SBOM/provenance созданы; exploitable finding уровня critical/high нет
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: migrations
    version: 1
    profile: release
    mandatory: true
    owner: DB owners
    predecessors: [config_security]
    command: pnpm test:migrations:clean && pnpm test:migrations:forward
    timeout: 1800
    inputs: [migration-sources, isolated-databases]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: пять пустых DB достигают точной schema; повторный запуск — no-op; legacy не меняется
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: db_boundaries
    version: 1
    profile: release
    mandatory: true
    owner: DB owners
    predecessors: [migrations]
    command: pnpm db:smoke
    timeout: 1800
    inputs: [isolated-databases, owner-roles]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: allowlisted operations проходят; любой cross-owner доступ отклоняется
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: integration
    version: 1
    profile: release
    mandatory: true
    owner: Service owners
    predecessors: [db_boundaries, supply_chain]
    command: pnpm test:integration
    timeout: 1800
    inputs: [source-tree, isolated-databases, kafka-run-resources]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: suites HTTP/DB/Kafka/idempotency/concurrency проходят
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: recovery
    version: 1
    profile: release
    mandatory: true
    owner: Reliability
    predecessors: [integration]
    command: pnpm test:recovery
    timeout: 1800
    inputs: [source-tree, isolated-databases, kafka-run-resources]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: matrix duplicate/crash/replay/rebalance/lease/fence/reservation проходит
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: compose
    version: 1
    profile: release
    mandatory: true
    owner: Platform
    predecessors: [recovery, supply_chain]
    command: pnpm test:compose-smoke
    timeout: 1800
    inputs: [source-tree, compose-project]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: все runtimes готовы; проверки отказа dependency и graceful stop проходят
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: observability
    version: 1
    profile: release
    mandatory: true
    owner: Operations
    predecessors: [compose]
    command: pnpm test:observability
    timeout: 1800
    inputs:
      [accepted-issue-64-handoff, accepted-issue-210-handoff, compose-project]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: проверки health/metrics/traces/correlation/alerts/redaction проходят
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: browser
    version: 1
    profile: release
    mandatory: true
    owner: Frontend
    predecessors: [observability]
    command: pnpm test:playwright
    timeout: 1800
    inputs: [source-tree, browser]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: проверки Chromium critical/accessibility/deep-link/conflict/realtime проходят
    cleanup: none
    rerunPolicy: new-run-id-only
  - id: aroma_sandbox
    version: 1
    profile: release
    mandatory: true
    owner: Integration+Reliability
    predecessors: [browser]
    command: pnpm test:aroma-sandbox -- --approval-file "$AROMA_SANDBOX_APPROVAL_FILE"
    timeout: 1800
    inputs: [signed-sandbox-approval, scoped-sandbox-credentials]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: контролируемые GET→≤1 mutation→GET/lost-response/recovery/restore проходят
    cleanup: restore-baseline-required
    rerunPolicy: new-run-id-only
  - id: backup_restore
    version: 1
    profile: release
    mandatory: true
    owner: DB owners
    predecessors: [aroma_sandbox]
    command: pnpm test:backup-restore
    timeout: 1800
    inputs: [isolated-databases, encrypted-backups]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: пять dump восстановлены; schema/data/invariants совпадают
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: rollback
    version: 1
    profile: release
    mandatory: true
    owner: Operations
    predecessors: [backup_restore]
    command: pnpm test:mutation-disable-rollback
    timeout: 1800
    inputs: [source-tree, compose-project]
    expectedArtifacts: [result.json, stdout.log, stderr.log]
    passCriteria: mutation выключена; observer/Orders/recovery healthy; потери состояния нет
    cleanup: exact-run-resources-only
    rerunPolicy: new-run-id-only
  - id: report
    version: 1
    profile: both
    mandatory: true
    owner: Release owner
    predecessors:
      [
        preflight,
        install,
        generated,
        static,
        unit,
        contracts,
        architecture,
        config_security,
        migrations,
        db_boundaries,
        integration,
        recovery,
        supply_chain,
        compose,
        observability,
        browser,
        aroma_sandbox,
        backup_restore,
        rollback,
      ]
    command: pnpm launch:verify:report
    timeout: 900
    inputs: [run-result, gate-evidence]
    expectedArtifacts: [ОТЧЁТ.md, decision.json, checksums.sha256]
    passCriteria: русский отчёт, checksums, defects и детерминированное решение валидны
    cleanup: none
    rerunPolicy: new-run-id-only
