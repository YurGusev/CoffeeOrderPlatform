behavior:
  - Дочерний runtime сообщает о готовности по IPC после успешного startRuntime; до этого сигналы не отправляются.
  - Ожидание готовности ограничено существующим в тестовом файле health.startupGraceMs 30000 ms; ранний exit или ошибка child завершают тест ошибкой.
  - SIGTERM и SIGINT отправляются без sleep и подтверждаются отдельными IPC-сообщениями; shutdownGraceMs остаётся 50 ms.
  - При подтверждении каждого сигнала проверяется наличие именно сохранённого до установки тестового listener обработчика runtime.
  - Сохранены ограничения ожидания завершения и проверки exit code 1, ровно одного stop hook, destroy hook и shutdown log; после exit ожидается закрытие потоков child.
