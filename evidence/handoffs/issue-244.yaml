behavior:
  - После авторизации api-public сохраняет валидный входной carrier; при отсутствии использует валидный
    активный server span. Один forwarding context используется для подписи claims и HTTP headers.
  - Orders после авторизации сохраняет входной carrier или использует валидный активный server span для
    command context и Outbox.
  - Проверяемые raw claims не меняются. Без валидного active span сохраняется прежний fallback; wire schema
    и idempotency hash не меняются.
  - api-public явно объявляет уже закреплённый @opentelemetry/api 1.9.1 как production dependency; новых
    пакетов, версий или toolchain pins нет.
