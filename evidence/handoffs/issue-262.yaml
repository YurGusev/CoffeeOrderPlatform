behavior:
  - "Компактный семантический список: название 14px, категория под ним, наличие и единица. Обе цены и quantity выровнены,
    включая товары без помола; mobile сохраняет reflow и primary target 44px."
  - Фактическая category.name проходит Gateway/import/activation/Catalog. Nullable миграции 0010/0011 не меняют canonical
    bytes старых snapshots без категории. Unknown отображается как «Не указана».
  - "Один Catalog GET дополняется bounded readonly Pricing preview: catalog:read, существующая owner delegation, одна
    активная policy, существующая bigint formula, максимум 50 пар и concurrency 8. Caller не передаёт деньги или policy."
  - API-public проверяет точные revision/refs/unit и полный уникальный набор цен; общий Catalog deadline 1000ms сохранён.
    Unavailable/unmapped строки не получают цены, UI показывает «Недоступна». Невалидный или неполный preview не выдаётся
    как частичный успех.
  - Обе серверные суммы показываются за product.unit. Preview не создаёт quote/idempotency/audit records. Добавление
    использует прежний quote→PUT и pricing:create; preview не определяет принятую цену заказа.
  - Поиск, availability, cursor pagination, allowedActions и guards editable Draft сохранены; standalone остаётся
    просмотром.
  - Trusted bootstrap обновил 15 due internal certPem с прежними CA/keys/SAN; public RSA и browser trust сохранены.
