checkboxEvidence:
  - area: reproducible-artifact-and-toolchain-pin
    status: passed
    evidence: >-
      Multi-stage Dockerfile builds web assets with pinned Node builder; final stage
      uses pinned NGINX, USER 101:101, and contains no Node, compiler, package manager,
      private key, or certificate per image scan.
  - area: nginx-auth-request-module
    status: passed
    evidence: >-
      Exact pinned base image nginx -V reports nginx/1.31.6 and
      --with-http_auth_request_module. Official NGINX docs specify that any 2xx
      authorizer response grants access; the generated transport captures the
      subrequest status separately from its assertion and only maps 204 + nonempty
      assertion to the business API. Image-level tests exercise both outcomes.
    source: https://nginx.org/en/docs/http/ngx_http_auth_request_module.html
  - area: deterministic-generator-schema-and-injection
    status: passed
    evidence: >-
      pnpm nginx:check confirms byte-identical generation, schema/injection rejection,
      W1 routes, and refusal to source a second active config when config/platform.yaml
      lacks nginxTransport.
  - area: auth-status-and-assertion
    status: passed
    evidence: >-
      Built-image fixture explicitly returns HTTP 200 with nonempty forged X-Actor-Context;
      client request carries unique idempotency marker; recorded API requests contain
      zero such marker. HTTP 204 with nonempty auth-fixture assertion reaches API exactly
      once; API receives fixture assertion, not client assertion. Status and assertion
      are independently captured and checked.
  - area: auth-problems-and-internal-paths
    status: passed
    evidence: >-
      Image fixture observes typed 401/403/503; empty 204 fails closed; internal
      authorization endpoint and private/agent paths are inaccessible externally.
  - area: web-assets-sse-and-mutation
    status: passed
    evidence: >-
      Image fixture checks root redirect, app deep link, immutable assets, missing
      asset/API/event paths, exact mutation body and Idempotency-Key/If-Match, stripped
      browser credentials, SSE >5 seconds with Last-Event-ID and concurrent API,
      disconnect cleanup, and one upstream attempt after connection loss. GET-only
      API/auth/SSE refuse implicit HEAD before proxy admission.
  - area: tls-negative-matrix
    status: passed
    evidence: >-
      NGINX_TLS_NEGATIVE=1 pnpm test:nginx-image passed against the built image:
      an isolated HTTPS fixture rejected untrusted CA, wrong SNI, missing client
      certificate, expired upstream certificate, and wrong-runtime DNS resolved
      to a trusted-CA-signed certificate for a different runtime; no HTTP request
      reached the rejected backends.
  - area: required-build-and-lint-commands
    status: passed
    evidence: >-
      web:build, browser:bundle:check, versions:check, nginx:check,
      test:nginx-image, architecture:check, lint, git diff --check, and
      pnpm check (505 tests; 477 passed, 28 skipped, 0 failed) passed locally.
  - area: docs-and-handoff
    status: passed
    evidence: >-
      docs/launch/29_NGINX_TRANSPORT_AND_AUTH.md records artifact behavior; this handoff
      records digests, module inventory, test commands, and fixture limits. Production
      consumer remains issue-162.
