limitations:
  - "Изолированная ветка от develop; перенесены только оптимизации текущей беседы, чужой WIP сохранён в исходном checkout."
  - "Датированные отчёты описывают предшествующие локальные измерения и применение на frozen release; A/B в этом PR повторно не запускался."
  - "Оптимизации redaction и Kafka pause/resume не развёрнуты на рабочих образах. Merge не является deployment."
  - "Host-настройки SSD BuildKit, GC и swap представлены отчётом; одноразовые административные скрипты и private cache не публикуются."
  - "Сохранность двух CoffeeOrderDb и 33 именованных volumes зафиксирована историческим metadata comparison; SQL/checksum бизнес-данных не выполнялись."
  - "Healthcheck 30s увеличивает время обнаружения отказа; start_interval 5s действует при старте до healthy. Broker JVM/heap, аутентификация и probe остаются прежними."
  - "Перед сменой pinned Kafka image необходимо проверить /opt/kafka/kafka.jsa и успешность CLI; текущие flags проверены в установленном образе."
  - "Снижение среднего CPU всей машины после Java flags не доказано. Микробенчмарки не равны выигрышу сервера под бизнес-нагрузкой."
  - "G12, полный G00–G19, длительный workload и heap dump в этой поставке не выполнялись. #13/#266 и их статусы не изменяются."
  - "Штатный CI проверяется по окончательному head в PR; его результат фиксируется в GitHub после commit, без self SHA в handoff."
