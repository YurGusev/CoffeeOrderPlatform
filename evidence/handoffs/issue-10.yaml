scope:
  included:
    - exact api-internal and Gateway operations for Catalog export, cart read, set quantity and remove
    - canonical supplier/account scope, signed delegation and native mTLS boundaries
    - encrypted provider sessions, safe cart retry, full cart identity and durable mutation journal
    - validated mutation acknowledgement, one unsafe dispatch and reconciliation without mutation retry
    - supplier-scoped offer binding, collision detection and traversal provenance
    - PostgreSQL, AROMA Compose and isolated recovery-proof acceptance harnesses
  excluded:
    - unproven provider Catalog money, unit, availability, image and packing/grind normalization semantics
    - unproven provider quantity bounds, step and fractional support
    - Catalog staging/activation, Orders convergence, Pricing, checkout and invoices
    - commit, push, pull request, issue close, merge and deployment
