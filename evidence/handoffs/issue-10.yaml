claims:
  proven:
    - immutable binding registration/replay/conflict/race/restart/lost-answer/store-grants
    - real container mTLS caller-api-internal-gateway path
    - Gateway-side client-certificate verification error correlated to the untrusted fixture connection
    - strict Gateway socket association without all-sockets fallback
    - delegation signing and Gateway claim enforcement
    - no raw provider canary in HTTP responses/logs/sanitized proof output
    - canonical secrets validator remains strict
    - canonical hmac-sha256-v1 UTF-8 framing/NUL/NFC/domain validation and variant non-generation
    - synchronized Catalog staging naming authority across specification/profile/schema/validator/role-map/tests
    - explicit-source bounded NDJSON export backpressure/cancellation/limits/hash-count and terminal lifecycle core
    - bidirectional product/variant/offer source-identity collision detection across flushed export batches
    - Integration mutation journal CAS/lease/dispatch-before-HTTP/UnknownOutcome/replay state machine
    - generated internal-v1 AromaMutationResponse and isAromaProblem validation before terminal persistence
    - source-owned RFC 3986 URI-reference pattern shared by contract AJV and generated runtime validation
    - invalid ProblemDetails type/instance 1:abc, :abc, /[::1], spaces, backslash, malformed percent, NUL, bracket and quote fail closed
    - valid ./1:abc, /a:b, //[::1]/, http://[::1]/, uppercase HTTP URI, URN, relative path/query/fragment and percent encoding remain accepted
    - exact narrowing evidence executes old-valid/new-invalid fixture proof and rejects ineffective evidence
    - SetLineQuantity null/zero rejection before reservation while RemoveLine retains null
    - positive-only ProviderQuantity source schema and positive Integration journal SQL constraint without invented provider max/scale/step
    - reserve unknown-COMMIT reread compares the original normalized request and trusted delegation before replay/in-progress recovery
    - two consecutive real PostgreSQL runs deterministically gate competing terminal COMMIT before recovery reread and return AROMA_OPERATION_REF_CONFLICT
    - real PostgreSQL terminal-COMMIT reread for both persisted-terminal and absent-terminal outcomes without redispatch
  not_proven:
    - provider-backed completed-snapshot producer/exporter and production source membership/binding population
    - catalog currency/scale/unit/variant/availability/imageUrl normalization and providerSnapshotRef authority
    - production HMAC key material wiring and full provider identity protocol
    - provider cookie TTL semantics beyond observed rotation and companion-cookie lifecycle beyond the implemented validated merge
    - cart-line identity/duplicates/completeness and provider quantity/packing semantics
    - provider-backed live acceptance of production set/remove dispatch against the external AROMA account
    - full Compose readiness while coffee_postgres infrastructure is absent
    - historical bootstrap-first Query read timeout root cause; not reproduced in bounded rerun
