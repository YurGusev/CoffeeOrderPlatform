- "Миграция 0004 восстановлена до checksum первого head PR #147; 0008 добавляет grind options и active metadata впереди. Если версия 0004 из промежуточного head cbfd42a была применена в постоянной БД, её ledger будет конфликтовать: это нужно проверить до rollout и согласовать отдельное восстановление; автоматически не обходим drift."
- "Бюджет 100 000 offers / RSS §7 относится к ingestion #6. Activation сохраняет полное поколение в памяти; нагрузка и задержка Outbox relay при долгой активации отдельно не измерялись."
- "Локальные проверки и handoff не заменяют GitHub CI, merge и приемку владельцем; опубликованный head PR #147 проверяется отдельно после push."
