limitations:
  - 'Acceptance после merge ещё не выполнен; #62 не принимает unmerged predecessor.'
  - >-
    Полный Compose health gate с stub secrets завершился ошибкой required readiness 503.
    Diagnostic start созданных контейнеров проверил 15 roots, но не является production admission.
  - 'Реальные DB/Kafka readiness checks подключают владельцы #62/#63; до этого их roots not-ready.'
  - >-
    Owner ledger в lifecycle test — fixture границы cancellation, не durable idempotency.
    TransactionOutcomeUnknown, restart-safe replay и Inbox/Outbox относятся к #62/#63.
  - >-
    Native Promise не отменяется принудительно: незавершённая работа требует fail-stop. Блокировку самого
    event loop завершает внешний supervisor.
  - Provider/production mutations не выполнялись. Live PG proof проверяет baseline bootstrap/permissions, а не transaction outcome #62.
