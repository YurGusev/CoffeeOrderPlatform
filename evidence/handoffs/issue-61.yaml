runtimeContract:
  import: '@coffee-platform/runtime'
  entrypoint: startConfiguredRuntime(name, composition?)
  composition:
    - configure(app, signal)
    - 'readinessChecks: {name, check(signal)}[]'
    - 'resources: {name, start?(signal), stop(signal), destroy()}[]'
  controller:
    - start()
    - phase()
    - transition(next)
    - closeRuntime(signal?)
    - whenStopped
  phases:
    - starting
    - running
    - draining
    - stopped
  signals:
    - SIGTERM
    - SIGINT
  startupGraceMs: 30000
  readinessTimeoutMs: 1000
  shutdownGraceMs: 30000
  failStopExitCode: 1
  requestContext:
    - correlationId
    - traceparent
    - signal
    - deadlineUtc
    - acceptDurable()
