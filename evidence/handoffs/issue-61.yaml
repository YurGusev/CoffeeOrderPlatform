liveComposeProof:
  command: node /tmp/coffee-issue61-proof/tools/compose-smoke.mjs --stub-secrets --provision-empty-postgres-network --project-name coffee-issue61-proof --keep --no-build
  fullHealthGate: failed
  exitCode: 1
  reason: Owner roots без DB/Kafka readiness hooks возвращают 503 до #62/#63.
  isolation: Временная копия Compose с уникальными coffee_issue61_proof_* сетями; чужой Kafka/PostgreSQL не использовался.
  build: Все 15 образов собраны из исходников #61 с Dockerfile оптимизации #68.
  diagnostics:
    mode: После failed gate созданные контейнеры запущены напрямую через docker start; dependency gate не считается пройденным.
    liveness200: 15
    metrics200: 15
    readiness200: [edge-gateway, api-public, api-internal, web]
    readiness503: [customer-service, catalog-service, catalog-supplier-sync, catalog-activation-worker, pricing-service, orders-service, orders-aroma-preparation, aroma-observer, aroma-convergence, aroma-gateway, realtime-gateway]
    kafka:
      result: passed
      transport: SASL_SSL
      proof: kafka-topics.sh create + kafka-console-producer.sh + kafka-console-consumer.sh, один уникальный topic/message, exact round-trip.
      target: localhost:9092 внутри изолированного Kafka container; клиентские свойства из tmpfs.
    shutdown:
      command: docker compose --project-name coffee-issue61-proof stop --timeout 30
      runtimeExitCode: 0
      runtimeCount: 15
    cleanup: Контейнеры, уникальные сети и scoped tmpfs secret directory удалены.
  limits: Это baseline broker compatibility и runtime lifecycle proof; durable delivery/restart/transaction failure proof остаются #62/#63.
acceptanceAudit:
  scenarioResults:
    - scenario: premature GET response disconnect aborts the request signal
      result: passed
    - scenario: partial POST input disconnects before the request is complete
      result: passed
    - scenario: normal finished response does not abort and clears the deadline timer
      result: passed
    - scenario: durable acceptance survives disconnect and idempotency replay does not repeat the effect
      result: passed
    - scenario: startup blackhole times out, cleans acquired resources, and skips later resources
      result: passed
    - scenario: blackhole resource stop is bounded and force-destroyed
      result: passed
    - scenario: readiness blackhole is bounded and does not start new probes while pending
      result: passed
    - scenario: all 15 configured roots use one real listen/controller lifecycle and dependency matrix
      result: passed
      proof: Каждый root добавляет ровно один TCPServerWrap и по одному SIGTERM/SIGINT handler; после stop возвращается исходное количество.
    - scenario: startRuntime removes signal listeners and repeated process signals perform one shutdown in a child
      result: passed
      proof: SIGTERM, затем SIGINT запускают один shutdown, один stop и один destroy; fail-stop exit code 1.
  currentOwnerComposition: Все 15 apps вызывают startConfiguredRuntime без composition; реальные DB/Kafka checks/resources подключают #62/#63, matrix использует явные fixtures.
  businessOwnership: Runtime не принимает решения о retry или compensation и не повторяет provider effect; TransactionOutcomeUnknown и durable idempotency принадлежат #62, Inbox/Outbox — #63.
  labels:
    allowed: [runtime, phase, configured dependency name, configured resource name]
    nameConstraint: Уникальные имена по шаблону [a-z][a-z0-9-]{0,63}.
    forbiddenMetricLabels: [correlationId, traceparent, requestId, payload, secrets]
    requestLogs: correlationId и валидный W3C traceparent; без request body и secrets.
