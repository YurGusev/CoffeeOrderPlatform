verification:
  - command: pnpm nginx:check && pnpm test:nginx-image
    result: passed
    exitCode: 0
    detail: >-
      Isolated image fixture проверяет JavaScript MIME, logout Origin, auth transport
      timeout и сохранение mTLS. Active cutover проверяется отдельной командой.
  - command: pnpm test:nginx-cutover && NGINX_TLS_NEGATIVE=1 pnpm test:nginx-image
    result: passed
    exitCode: 0
    detail: >-
      Active fixture проверяет signed Ed25519 assertion, exact API path, mTLS,
      SSE >5s, rejected reload, rotation и rollback; synthetic issuer withdrawal
      не доказывает CRL. Negative TLS fixture выполнялся после active test.
  - command: node --test tests/compose/topology.test.mjs && git diff --check
    result: passed
    exitCode: 0
    detail: Compose объявляет 2 vCPU, 512 MiB memory, 16384 nofile и 8 MiB tmpfs только для nginx.
  - command: pnpm image:build --target runtime --build-arg RUNTIME=edge-gateway --tag coffee-platform-edge-gateway:local --load .
    result: passed
    exitCode: 0
    detail: Локальная Node image собрана с lockfile patch input, без registry publication.
  - command: pnpm image:build --target edge-nginx --tag coffee-platform-edge-nginx:local --load .
    result: passed
    exitCode: 0
    detail: Локальная native nginx image собрана через generator и nginx:check, без публикации.
  - command: pnpm lint && pnpm typecheck && pnpm config:check && pnpm architecture:check && pnpm security:secrets && pnpm versions:check && docker compose config --quiet && git diff --check
    result: passed
    exitCode: 0
  - command: pnpm install --frozen-lockfile && pnpm check
    result: passed
    exitCode: 0
    detail: Локально 549 тестов (521 passed, 28 skipped); проверка не равна GitHub CI.
  - command: NGINX_TLS_NEGATIVE=1 pnpm test:nginx-image
    result: passed
    exitCode: 0
    detail: Отдельно проверены untrusted CA, wrong SNI, отсутствующий client cert, истёкший и wrong-runtime upstream cert.
  - command: pnpm test:compose-smoke --recovery-proof --provision-empty-postgres-network --no-build --project-name coffee-issue162-debug
    result: passed
    exitCode: 0
    detail: >-
      Все 14 Node runtimes и native nginx стали healthy; synthetic recovery
      PostgreSQL/Kafka, loopback-only 8443 и route/auth probes прошли. --no-build
      использовал локально предварительно собранные images; project/volume/network
      и временные scoped secrets удалены после выхода.
      Перед этим отдельный запуск упал с Query read timeout; повтор под существующим
      project image tag завершился exit 0. Другой project с --no-build не имел images.
limitations:
  - >-
    config/platform.yaml.browserOidc остаётся null и fail-closed: реальный issuer,
    actor mapping, production IdP и browser login здесь НЕ проверены.
  - >-
    Production SOPS не расшифровывали и не меняли. Схема допускает исторический
    encrypted web leaf только как данные, но не как действующий runtime scope;
    native edge-nginx identity необязательна в inventory до отдельного provisioning,
    bootstrap при отсутствии material fail-closed.
  - >-
    Synthetic trust-bundle withdrawal доказывает отказ для изъятого issuer,
    не CRL-based revocation; реальная PKI issuance/6h rotation/12h overlap
    и production certificate trust здесь НЕ проверены.
  - >-
    5000-stream capacity и browser EventSource остаются за #12; business UI за #9,
    native telemetry applicability за #64, final launch/security admission за #13,
    W2/W3 ingress за #77/#99. Не выполнялись deployment, DNS/firewall,
    registry publication и provider callbacks.
