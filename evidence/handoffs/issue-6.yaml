limitations:
- Реальных вызовов AROMA и мутаций у провайдера не выполнялось.
- Ветка опубликована в PR #145; merge и deployment не выполнялись. Отмеченный выше Compose receipt относится к более раннему HEAD.
- Issue #16 должен использовать собственный owner-local database adapter Catalog, а не импортировать runtime-код catalog-supplier-sync.
- Live restart использует локальный bootstrap/DNS и mTLS InternalApi fixture, но не deployed api-internal, Gateway или provider.
- Проверка ёмкости использует управляемый persistence seam и sampled memory в процессе с old-space 64 MiB, а не сквозной DB/provider benchmark.
- Наблюдались OTel-инструментация и runtime metrics; доставка во внешний collector не проверялась.
- Compose recovery proof использует generated fixture credentials и локальный HTTPS provider, а не production secrets/provider.
- Проверка terminal capacity исполняет production complete/hash/reconstruction с lazy SQL fixtures, но не измеряет ёмкость PostgreSQL.
- Первая попытка pnpm check дала DB_POOL_EXHAUSTED в AROMA binding saturation; изолированный и полный повторы прошли без исправлений;
  журнал первого отказа сохранён.
