transactionContract:
  entrypoint: withTransaction(database, {mode, signal?, correlationId?, causationId?, traceparent?}, callback)
  opaqueBoundary: >-
    Database предоставляет resource/readiness/metrics; Transaction — только state(). Native client не экспортируется.
    Fixed parameterized statements и COPY доступны owner infrastructure/repositories через database/owner; DDL —
    checksum runner.
  runtimeComposition: >-
    configure(app, signal, database?) получает тот же единственный owner pool. Startup failure уничтожает созданный
    pool.
  states:
    - NotStarted
    - Active
    - Committing
    - Committed
    - RollingBack
    - RolledBack
    - Unknown
  outcomeTable:
    - observation: Checkout failure/abort до BEGIN
      result: Typed DB error; callback не запущен
      release: Late acquired connection уничтожается
    - observation: Ответный command tag COMMIT
      result: Committed; callback result; разрешён acceptDurable()
      release: Release здорового connection
    - observation: Typed failure до COMMIT + подтверждённый ROLLBACK
      result: RolledBack; исходная typed failure
      release: Release, broken/pending connection уничтожается
    - observation: Abort до COMMIT + подтверждённый ROLLBACK
      result: RolledBack; DB_INTERRUPTED
      release: Release, broken/pending connection уничтожается
    - observation: Потерянный/blackhole ответ COMMIT, неизвестный tag
      result: Unknown; TRANSACTION_OUTCOME_UNKNOWN
      release: Destroy; без ROLLBACK, retry или reacquire
    - observation: ROLLBACK без подтверждения после failure/abort
      result: Unknown; DB_ROLLBACK_FAILED; previousCode сохраняется
      release: Destroy; отдельная owner reconciliation
    - observation: Перехваченная SQL error; tag ROLLBACK на COMMIT
      result: RolledBack; DB_TRANSACTION_ROLLED_BACK; owner/Completed откатились, ложного Replay нет
      release: Release здорового connection
    - observation: Использование terminal/foreign transaction, незавершённые statement wrappers
      result: DB_INVALID_TRANSITION
      release: SQL через terminal context не отправляется
  deadlinesMs:
    checkout: 250
    transaction: 10000
    terminal: 2000
    interactiveStatement: 1500
    backgroundStatement: 5000
    lock: 250
    idleTransaction: 30000
    shutdownGrace: 30000
  budgetProof: >-
    250 + 10000 + 2 × 2000 = 14250 < 30000. Request/shutdown abort действует до COMMIT; начатый COMMIT использует свой
    terminal budget.
  admission:
    steady: 56
    oneRollout: 8
    reserved: 32
    total: 96
    maxConnections: 96
    rolloutReplicas: 1
    ordersPoolMax: 4
    proof: >-
      Declared replicas сверены с database-role-map; превышение блокирует parse/startup. Нет автоматического увеличения
      server/pools.
  recovery: >-
    Никакого automatic SQL retry после unknown. Новый process/store читает durable owner truth отдельной transaction.
    Deadline сам по себе не доказывает rollback.
  ssl: >-
    prefer: TLS сначала, plaintext fallback только при явном отказе SSL negotiation до authentication/BEGIN. Ошибка
    certificate не повторяется.
idempotencyContract:
  identity:
    - actorRef
    - scope
    - key
  sqlIdentity:
    - actor_ref
    - scope
    - idempotency_key
  hash: SHA-256 canonical JSON; stable object keys; array order сохраняется; non-JSON значения запрещены
  decisions:
    - Acquired
    - Replay
    - Conflict
    - InProgress
  atomicity: >-
    acquire + owner writes + complete выполняются в одной opaque transaction. complete разрешён только после acquire тем
    же store в том же context.
  lease: >-
    Активный и expired Acquired остаются InProgress; expired не даёт takeover unknown effect. Completed возвращает
    сохранённый terminal response, включая JSON null/string.
  sql: |-
    CREATE TABLE <owner_schema>.idempotency_records (
      actor_ref text NOT NULL,
      scope text NOT NULL,
      idempotency_key text NOT NULL,
      request_hash char(64) NOT NULL CHECK (request_hash ~ '^[0-9a-f]{64}$'),
      state text NOT NULL CHECK (state IN ('Acquired', 'Completed')),
      lease_owner text NOT NULL,
      lease_until timestamptz NOT NULL,
      created_at timestamptz NOT NULL,
      expires_at timestamptz NOT NULL,
      completed_at timestamptz,
      response_status integer,
      response_body jsonb,
      resource_ref text,
      PRIMARY KEY (actor_ref, scope, idempotency_key),
      CHECK (expires_at >= lease_until AND lease_until > created_at),
      CHECK ((state = 'Acquired' AND response_status IS NULL AND completed_at IS NULL)
        OR (state = 'Completed' AND response_status BETWEEN 100 AND 599
          AND response_body IS NOT NULL AND completed_at IS NOT NULL))
    );
  ownerMigrations:
    - issue: 5
      owner: Customer
      table: idempotency_records
    - issue: 7
      owner: Pricing
      table: pricing_idempotency_records
    - issue: 8
      owner: Orders
      table: idempotency_records
    - issue: 10
      owner: Integration
      detail: Owner operation journal; idempotency table только вместе с требующим её command и grants.
  migrationContract: >-
    applyMigrations: owner schema ledger, advisory xact lock, immutable checksum и точный applied prefix. Drift/missing
    checksum/orphan/non-prefix/DDL failure останавливают запуск. Ledger+DDL+checksum атомарны; отдельная migrator role.
  copyContract: >-
    Fixed owner schema/table/columns, Node pipeline/backpressure + AbortSignal/budget. Source уничтожается, raw
    stream/client не выходит наружу.
consumers:
  '63': >-
    Inbox/Outbox tables, relay и Kafka delivery здесь не реализованы. Использовать opaque Transaction и durable SQL
    IdempotencyStore в owner transaction; добавить свои lifecycle/readiness hooks.
  '64':
    codes:
      - DB_POOL_EXHAUSTED
      - DB_INVALID_CONFIGURATION
      - DB_CONNECTION_LOST
      - DB_QUERY_TIMEOUT
      - DB_QUERY_FAILED
      - DB_INTERRUPTED
      - DB_ROLLBACK_FAILED
      - TRANSACTION_OUTCOME_UNKNOWN
      - DB_INVALID_TRANSITION
      - DB_TRANSACTION_ROLLED_BACK
      - DB_STOPPED
    gauges:
      - active
      - idle
      - waiting
      - pending
    counter: saturationTotal
    boundedLabels:
      - configured runtime
      - listed machine code
    correlationFields:
      - correlationId
      - causationId
      - traceparent
    redaction: >-
      Не включать SQL, parameters, credentials, payload или correlation identifiers в metric labels. Error message равен
      machine code; sqlState и previousCode безопасны.
