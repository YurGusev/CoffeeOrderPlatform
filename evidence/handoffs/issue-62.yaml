nonCooperativeProof:
  test: database non-cooperative callback remains owned for runtime fail-stop
  command: pnpm test
  fixtureShutdownGraceMs: 40
  observedShutdownMs: 41.97993100000008
  status: fail-stop
  pending:
    - server-close
    - stop:database
  detail: >-
    Transaction завершается bounded, но native callback остаётся tracked до settlement. Runtime фиксирует fail-stop и
    exit code 1; произвольный Promise не отменяется принудительно.
limitations:
  - >-
    Полный Compose gate 15 roots с required Kafka hooks не пройден: Kafka foundation принадлежит #63. Owner-local
    Compose proof фиксируется отдельно.
  - >-
    Business schemas/migrations, HTTP/provider effects, Inbox/Outbox delivery и production data не менялись. SQL tables
    в live proof — удаляемые fixtures.
  - >-
    При блокировке самого event loop fail-stop обеспечивает внешний supervisor. Локальные wall-clock результаты не
    являются production SLA.
  - >-
    require/verify-full fail closed с проверкой certificate; scoped Compose использует prefer и PostgreSQL без TLS. TLS
    certificate refusal покрыт unit test, отдельный live TLS PG не запускался.
