limitations:
  - >-
    Late mutation privacy regression сохраняет один QueryClient через controlled SPA history transition.
    Native Link/Back, Edge и реальный backend для этой гонки отдельно не проверялись.
  - >-
    Перекрывающиеся beginIntent проверены unit test с удержанием digest; sidebar/unmount race отдельно
    в браузере не воспроизводился. Существующая browser idempotency group прошла на свежем build.
  - >-
    Catalog cache privacy regression использует controlled SPA history transition с одним QueryClient.
    Native UI Link перезагружает документ; acceptance native Link/Back/Edge этим сценарием не подтверждена.
  - >-
    PR #172 открыт без Draft; browser-through-Edge/Compose served-surface acceptance
    и owner acceptance в этом прогоне не подтверждены.
    Producer #171 принят; прежняя зависимость от непринятого backend устранена.
  - >-
    Исторические baseline/typecheck/query/route failures выше относятся к прежним ревизиям; итоговые gates
    после merge accepted develop прошли; текущие Order Card P2 receipts приведены отдельно.
  - >-
    Production IdP, TLS/PKI, live provider mutation, deployment и CI в этом прогоне не проверялись. Browser
    proof использует mock API. Merge самого PR #172 и закрытие issue #9 не выполнялись.
  - >-
    Пользовательские 11 dirty/untracked settings/tooling файлов в основном checkout сохранены отдельно от
    чистой integration copy и исключены из PR.
