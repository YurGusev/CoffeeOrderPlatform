limitations:
  - Public Customer cursor contract was explicitly approved for this scope at 2048 characters with an 8 KiB Customer URL budget; Catalog keeps the shared Cursor contract at 512 and no stateful cursor was introduced.
  - Live Customer PostgreSQL 17.11 migration, grants, concurrency, rollback fault injection after each required write, durable-commit lost-response recovery, DB abort after Customer INSERT, unknown COMMIT/restart reconciliation, PII log canary and foreign-database CONNECT denial were not proven because required CUSTOMER_* URLs, mTLS fixtures and runtime are absent.
  - Default compose smoke was not proven because SOPS_AGE_KEY_FILE and sops are absent. The topology-only stub path now generates ephemeral, separate public and internal mTLS certificates but could not start because local runtime images are absent.
  - The canonical encrypted source lacks `edge.tlsCertificate`, Customer cursor, edge actor and delegation/service verification key paths. `edge.tlsCaBundle` is optional and its absence selects Node system trust; production runtime wiring still fails closed until an authorized SOPS provisioning action materializes the required values and valid scoped transport envelopes.
  - customer-integration is intentionally non-zero when live prerequisites are absent; this prevents a false process PASS with skipped acceptance tests.
  - Issue/PR text was not mutated; prepared issue correction is `Customer cursor — 2048 символов; Customer URL budget — 8 KiB; Catalog cursor — 512 символов.` Remote head remains `b847280`; this continuation is local-only until the separately authorized commit is created. Merge, issue checkbox mutation and issue closure were not performed.
