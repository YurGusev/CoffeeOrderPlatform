  - Public Customer cursor contract was explicitly approved for this scope at 2048 characters with an 8 KiB Customer URL budget; Catalog keeps the shared Cursor contract at 512 and no stateful cursor was introduced.
  - Live Customer PostgreSQL 17.11 migration, grants, concurrency, rollback fault injection after each required write, durable-commit lost-response recovery, DB abort after Customer INSERT, unknown COMMIT/restart reconciliation and foreign-database CONNECT denial were not proven because required CUSTOMER_* URLs and runtime are absent.
  - Default compose smoke was not proven because SOPS_AGE_KEY_FILE and sops are absent.
  - Accepted scoped config has no Customer cursor-signing key or mTLS transport verifier; required delegation verification refs are not materialized for these runtimes. The implementation fails closed instead of creating replacement capabilities.
  - customer-integration is intentionally non-zero when live prerequisites are absent; this prevents a false process PASS with skipped acceptance tests.
