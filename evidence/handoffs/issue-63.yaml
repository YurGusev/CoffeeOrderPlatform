deliveryContract:
  protocol: docs/launch/06_EVENTS_AND_RECOVERY.md
  ownerMigrationMap: docs/launch/13_DELIVERY_DEPENDENCY_GRAPH.md
  configuration: config/platform.yaml
  offsetOrder:
  - decode/transport validation
  - 'owner transaction: Inbox + owner writes + Outbox + Processed'
  - known DB COMMIT
  - Kafka offset commit
  realtimeException: Только realtime-gateway / realtime-gateway-v1 / coffee.realtime.invalidate.v1; validated local
    enqueue до offset, restart reset/refetch.
  stableIdentity: messageId неизменен; canonical SHA-256 полного envelope; unique Outbox aggregate_ref + aggregate_sequence
    независимо от messageType/ownerVersion.
  directionalExample:
    runtime: orders-aroma-preparation
    kafka:
      producers:
      - coffee.aroma.cart.commands.v1
      - coffee.realtime.invalidate.v1
      consumers:
      - groupId: orders-catalog-mapping-v2
        topics:
        - coffee.catalog.mapping.v2
        processing: durable
      - groupId: orders-aroma-preparation-v1
        topics:
        - coffee.orders.lifecycle.v1
        processing: durable
      - groupId: orders-aroma-projection-v1
        topics:
        - coffee.aroma.cart.events.v1
        processing: durable
  limits:
    producerRetries: 3
    maxMessageBytes: 1048576
    maxPartitions: 24
    maxInFlight: 4
    queueCapacity: 32
    sendTimeoutMs: 2000
    receiveTimeoutMs: 1000
    commitTimeoutMs: 2000
    revokeTimeoutMs: 2000
    shutdownTimeoutMs: 5000
    leaseMs: 30000
    retry:
      baseMs: 1000
      maxMs: 60000
      maxAttempts: 12
    quarantine:
      durable: owner-database
      realtime: topic-dlq
    scope: maxPartitions на consumer group; maxInFlight и queueCapacity совместно на runtime; один active handler
      на topic/partition
  unknownOutcomes:
    database: 'TRANSACTION_OUTCOME_UNKNOWN: offset не подтверждён; новая delivery через Inbox'
    offset: 'OFFSET_COMMIT_OUTCOME_UNKNOWN: stop intake, drain/revoke, bounded reconnect/reassignment; duplicate
      пропускает handler'
    producer: 'KAFKA_SEND_OUTCOME_UNKNOWN: Outbox остаётся leased до recovery, исходный messageId сохранён'
  ownerSql:
    access: Только owner-local opaque Transaction; cross-owner SQL запрещён
    protocol: SqlInboxStore/SqlOutboxStore; DDL fixture exportedSQLContract не является общей business migration
    migrationMap: config/database-ownership.json
    catalog: 'apps/catalog-service/migrations: grant catalog-activation-worker на outbox_messages'
    orders: 'apps/orders-service/migrations: inbox_messages, inbox_quarantine и outbox_messages; явные grants каждому
      runtime до admission'
    realtime: БД и Inbox отсутствуют
    protocolFields:
      inbox_messages:
      - message_id
      - message_type
      - received_at
      - payload
      - payload_hash
      - state
      - lease_owner
      - lease_until
      - attempt
      - processed_at
      - quarantine_reason
      - quarantined_at
      inbox_quarantine:
      - topic
      - partition
      - offset
      - message_id
      - message_type
      - payload_hash
      - envelope
      - reason
      - quarantined_at
      outbox_messages:
      - message_id
      - message_type
      - topic
      - aggregate_ref
      - aggregate_sequence
      - owner_version
      - partition_key
      - schema_version
      - envelope
      - payload
      - payload_hash
      - occurred_at
      - correlation_id
      - causation_id
      - traceparent
      - state
      - lease_owner
      - lease_token
      - lease_until
      - attempt
      - next_attempt_at
      - last_error
      - published_at
      - quarantined_at
    constraints:
    - Inbox PRIMARY KEY(message_id)
    - Quarantine PRIMARY KEY(topic, partition, offset)
    - Outbox PRIMARY KEY(message_id), UNIQUE(aggregate_ref, aggregate_sequence)
    - Outbox claim lease_owner + lease_token + live lease fencing
  observabilityHandoff:
    consumer: 64
    availableRuntimeSnapshot:
    - active
    - queued
    - pending
    - assigned
    - saturationTotal
    - unknownCommitTotal
    - recoveryTotal
    - lastCode
    downstreamInstrumentation:
    - consumer lag
    - capacity
    - Inbox lease expiry
    - quarantine
    - duplicate/conflict
    labels:
    - allowlisted runtime
    - groupId
    - topic
    - partition
    - finite machine reason
    correlationFields:
    - correlationId
    - causationId
    - traceparent
    forbidden: payload, key, envelope, SQL, credentials и secret material
  consumerBoundary: 'bind(groupId, {processing, database, inbox, decode, handle}); decoder/handler и canonical business
    schemas принадлежат downstream owner. Foundation не реализует семь business messages, HTTP contracts или provider
    semantics; #4 независим от Kafka delivery.'
  commonEnvelope:
    authority: docs/launch/12_LAUNCH_CONTRACT_CATALOG.md#6-семь-событий
    envelopeVersion: '1'
    required:
    - messageId
    - messageType
    - occurredAt
    - producer
    - correlationId
    - causationId
    - traceparent
    - aggregate
    - payload
    aggregate:
    - type
    - ref
    - version
    causationId: string | null
    payload: 'generic; business schemas поставляет #4'
    flatAlternative: false
verification:
- command: pnpm check
  result: passed
  exitCode: 0
  detail: 'authority 4; versions/compatibility/config/architecture/rule-parity/lint/typecheck; tests 134: 133 passed,
    1 opt-in live PG skipped (отдельный запуск ниже)'
- command: pnpm db:smoke
  result: passed
  exitCode: 0
  detail: 50 role cases; 6 structural checks, не live proof
- command: pnpm exec oxlint --deny-warnings tools/compose-smoke.mjs
  result: passed
  exitCode: 0
- command: node scripts/db-live-proof.mjs --run-id issue63canonicalhash --evidence-dir /tmp/coffee63-evidence
  result: passed
  exitCode: 0
  detail: disposable PostgreSQL; результаты livePostgresProof/liveDatabaseFoundationProof ниже; cleanup passed
- command: COFFEE_DB_LIVE_PROOF=1 node --test tests/database/live-db-proof.test.mjs
  result: passed
  exitCode: 0
  detail: 2 passed; canonical envelope; disposable PostgreSQL
- command: pnpm test:compose-smoke --recovery-proof --no-build --project-name coffee-recovery-foundation
  result: passed
  exitCode: 0
  detail: 15 runtime; real PostgreSQL/Kafka/TLS; retention, ordering, rebalance, quarantine, SIGTERM, crash windows,
    paused-broker blackhole
- command: node tools/compose-smoke.mjs --recovery-proof --no-build --project-name coffee-recovery-foundation
  result: passed
  exitCode: 0
  detail: повторный полный recovery proof; project cleanup verified
- command: node --test packages/platform-testing/test/platform-packages.test.mjs
  result: passed
  exitCode: 0
  detail: 28/28 после финального Inbox full-envelope hash assertion
- command: pnpm exec oxlint --type-aware --deny-warnings scripts/db-live-proof.mjs packages/platform-testing/test/platform-packages.test.mjs
  result: passed
  exitCode: 0
- command: git diff --check
  result: passed
  exitCode: 0
limitations:
- 'Single-broker RF=1 development scope: не production HA, replication/failover или host power-loss proof.'
- Recovery mode использует disposable PostgreSQL и generated scoped credentials/TLS; штатные SOPS credentials, внешний
  PostgreSQL и provider mutations не проверялись.
- Business schemas/handlers, owner migrations и grants, включая inbox_quarantine, принадлежат downstream issues;
  live DDL является disposable fixture.
- 'Расширенные lag/lease/quarantine/duplicate metrics, Collector и alerts поставляет #64.'
livePostgresProof:
  schemaVersion: 1
  runId: issue63canonicalhash
  delivery:
    transport: postgresql-only
    realKafka: false
    structural:
      kind: owner-local-sql-contract
      source: exportedSQLContract
      liveDatabase: false
      realKafka: false
      tables:
        inbox: '"orders"."issue63_live_inbox_messages"'
        quarantine: '"orders"."issue63_live_inbox_quarantine"'
        outbox: '"orders"."issue63_live_outbox_messages"'
        owner: '"orders"."issue63_live_owner_effects"'
      checks:
      - inbox-message-hash-state-lease
      - quarantine-topic-partition-offset-hash
      - outbox-stable-id-hash-lease-order
      - outbox-aggregate-sequence-independent-of-message-type
      - owner-effect-identity
      - owner-local-no-cross-table-reference
    brokerAckProof: not-run
    offsetCommitProof: not-run
    atomicity:
      committedInboxOwnerOutbox: true
      rollbackCode: DB_QUERY_FAILED
      rollbackLeftNoPartialRows: true
      redeliveryProcessed: true
    duplicateConflict:
      inboxDuplicate: true
      inboxConflict: true
      quarantine: created
      outboxDuplicate: true
      outboxConflict: true
    payloadHash:
      inboxValidated: true
      outboxValidated: true
      conflictQuarantined: true
      recoveredClaimValidated: true
    differentMessageTypeSequence:
      concurrent: true
      accepted: 1
      conflicts: 1
      durableRows: 1
    aggregateOrdering:
      sameAggregate:
      - '1'
      - '2'
      sequenceBarrier: true
      otherAggregateIndependent: true
    crashAfterClaimBeforeFinalize:
      stableMessageId: true
      recovered: true
