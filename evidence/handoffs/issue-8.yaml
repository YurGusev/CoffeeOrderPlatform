limitations:
  - "pnpm db:smoke без --execute — безопасный offline-план на 50 role cases, а не live proof изолированных прав PostgreSQL; live owner-local тесты Orders/Database указаны отдельно."
  - "Владелец утвердил OrderReconciliationRequested.v1 и границу #8/#11. Атомарный 202/History/Outbox/Completed/replay проверен с read-only test fixture OutOfSync; в production до #11 нет состояния, допускающего команду, поэтому PendingObservation остаётся 409. Проверка полного #11 Inbox/cart convergence не проводилась; фиктивных Desired/Observed нет."
  - "Изолированный штатный --recovery-proof повторён после последней replay/SQL правки и пересборки затронутых Orders/Customer/Pricing runtime images; Orders dist и shared idempotency dist сверены с images. Буквальная команда pnpm test:compose-smoke без параметров не проходила: preflight exit 1 из-за отсутствующего SOPS_AGE_KEY_FILE, с реальными credentials или существующей PostgreSQL-сетью её не запускать."
  - "Обычный pnpm test:compose-smoke без изолированного recovery fixture не запускался с реальным SOPS age ключом: штатный запуск требует SOPS_AGE_KEY_FILE и может подключить существующую PostgreSQL сеть; вместо него выполнен полный --recovery-proof с пересборкой."
  - "Kafka broker ACK OrderConfirmed.v1 после подтверждённого Orders Confirm проверен только на изолированных синтетических PostgreSQL/Kafka fixtures; production broker/IdP и реальные provider effects не проверялись."
  - "Синтетические actor/mTLS fixtures не доказывают production IdP, PKI/CRL, provider mutation AROMA или физическую сходимость корзины (#11)."
  - "Негативы проверены реальным локальным TLS peer с общей доверенной CA, scoped HttpClient и Orders readiness helper в createRuntime; отдельный тест не запускает production main, а positive Compose проверяет собранный main. Production PKI/CRL, зависшая настоящая служба и внешняя сеть не проверялись."
  - "Это локальный verification handoff: его результаты не подтверждают GitHub CI, приёмку владельцем, публикацию PR или merge; remote-состояние проверяется отдельно после соответствующего действия."
  - "Изменение shared platform-database ограничено лексическим разбором SQL миграции перед исполнением; владение транзакциями, checksums, rollback и public API не менялись."
  - "Browser helper itemRef, отображение server allowedActions и terminal classifier для pending intent относятся к #9; в #8 локально доказаны server validation, owner Card allowedActions и точные recovery marker/status/body, но не browser implementation. Live issue #8 теперь содержит разделённую acceptance-матрицу; оставшиеся процессные пункты проверяются отдельно после PR/merge."
