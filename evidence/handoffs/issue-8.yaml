  - {artifact: tests/orders/owner-live.test.mjs, sha256: 5032e57747e017840839ef407e03d2fdfdcb60b34c8cb4d7b0e7635e3f195ee8, consumers: [9, 11, 13]}
acceptance:
  - criterion: "Draft guards не принимают чужие customerRef/orderRef и сохраняют bodyless replay"
    code: "apps/api-public/src/index.ts, tests/orders/public-api.test.mjs"
    command: "node --test tests/edge-auth/*.test.mjs tests/orders/public-api.test.mjs tests/orders/owner-http.test.mjs tests/pricing/pricing-public-api.test.mjs"
    result: verified
  - criterion: "Семь permissions на contract/Edge/api-public/owner, включая Pricing и replay"
    code: "contracts/openapi/client-v1.yaml, apps/edge-gateway/src/client-operations.gen.ts, apps/orders-service/src/http/index.ts"
    command: "node --test tests/edge-auth/*.test.mjs tests/orders/public-api.test.mjs tests/orders/owner-http.test.mjs tests/pricing/pricing-public-api.test.mjs"
    result: verified
  - criterion: "Выбранная строка PricingQuote verify с проверкой всей сохранённой котировки"
    code: "contracts/openapi/internal-v1.yaml, apps/pricing-service/src/infrastructure/database/pricing-store.ts, apps/orders-service/src/infrastructure/pricing-client.ts"
    command: "COFFEE_DB_LIVE_PROOF=1 node --test tests/pricing/*.test.mjs"
    result: verified
  - criterion: "Orders scoped signing key и fail-closed секреты без production мутаций"
    code: "config/platform.yaml, secrets/platform.secrets.sops.yaml, apps/orders-service/src/infrastructure/order-security.ts"
    command: "pnpm config:check && pnpm security:secrets && git diff --check"
    result: verified-development-only
  - criterion: "Owner Draft/items/Confirm/Card/Desired, атомарный Confirm без внешних вызовов под SQL locks"
    code: "apps/orders-service/src/application/confirm-order.ts, apps/orders-service/src/infrastructure/database/order-store.ts, tests/orders/order-store.test.mjs, tests/orders/owner-live.test.mjs"
    command: "COFFEE_DB_LIVE_PROOF=1 node --test --test-concurrency=1 tests/orders/*.test.mjs tests/database/*.test.mjs"
    result: verified-synthetic-identity
    detail: "85/85 live без skipped после исправления stdout capture; оба owner-live теста видны по имени. Aggregate money guard, duplicate quote line, DB-time expiry, согласованный Card, DELETE bodyless replay, смешанная PUT/DELETE/Confirm race и allowedActions проверены на PostgreSQL."
  - criterion: "Первый запуск: чистые переходы Draft/Confirmed, таблица команд и exhaustive allowedActions"
    code: "apps/orders-service/src/domain/order-state.ts, apps/orders-service/src/domain/order-card.ts, apps/orders-service/src/infrastructure/database/order-store.ts, tests/orders/order-card.test.mjs"
    command: "pnpm typecheck && node --test tests/orders/order-card.test.mjs"
    result: verified-local
    detail: "CreateDraft, UpsertItem, DeleteItem, Confirm и RequestReconciliation используют pure nextOrderStatus; разрешения actions перечислены типизированным Record<allowedAction, permission>. Таблица переходов/permissions прошла, SQL пути покрыты live тестами."
  - criterion: "Orders readiness зависит от доступности required InternalApi"
    code: "apps/orders-service/src/main.ts, apps/orders-service/src/infrastructure/internal-api-readiness.ts, tests/orders/owner-http.test.mjs, tests/runtime/lifecycle.test.mjs"
    command: "pnpm exec tsc -b --pretty false && node --test --test-name-pattern='Orders InternalApi readiness rejects' tests/runtime/lifecycle.test.mjs"
    result: verified-local-transport
    detail: "main.ts подключает scoped Orders→api-internal client к checkInternalApiReady. Отдельный тест выполняет этот helper через реальный mTLS HttpClient и runtime health: wrong peer с доверенным CA → 503 до HTTP; успешный peer → 200; blackhole → deadline/503 и закрытие запроса; shutdown → RUNTIME_DRAINING/503 и stopped без pending. Негативный тест не запускает production main с настоящим peer; positive Compose запускает собранный main."
  - criterion: "Точные typed errors owner → api-public без сведения причин к общей ошибке"
    code: "contracts/openapi/client-v1.yaml, packages/generated/client-v1/src/runtime-schemas.gen.ts, apps/orders-service/src/http/index.ts, apps/orders-service/src/infrastructure/database/order-store.ts, apps/api-public/src/index.ts, tests/orders/owner-http.test.mjs, tests/orders/public-api.test.mjs, tests/orders/order-store.test.mjs"
    command: "node --test tests/edge-auth/*.test.mjs tests/orders/public-api.test.mjs tests/orders/owner-http.test.mjs tests/pricing/pricing-public-api.test.mjs"
    result: verified-local-status-code-pairs
    detail: "PUT 409 ORDER_ITEM_LIMIT_EXCEEDED/ORDER_QUOTE_SCOPE_MISMATCH; Confirm 422 ORDER_EMPTY/ORDER_DESIRED_OVERFLOW. Baseline public PUT request/parameters/security/operationId unchanged; неверные пары fail-closed."
  - criterion: "Атомарный reconciliation 202 shell и exact replay"
