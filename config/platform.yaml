$schema: ./platform.schema.json
schemaVersion: 1
environment: development
toolchainRef: config/toolchain-versions.json

platform:
  publicBaseUrl: https://localhost:8443
  shutdownGraceMs: 30000
  requestDeadlineMs: 5000
  bodyLimitBytes: 1048576

  health:
    livePath: /health/live
    readyPath: /health/ready
    metricsPath: /metrics
    intervalMs: 5000
    timeoutMs: 1000
    startupGraceMs: 30000
    failureThreshold: 3
    successThreshold: 1
  outbox:
    pollIntervalMs: 250
    batchSize: 100
    claimLeaseMs: 30000
    maxAttempts: 12
    backoffMs: [1000, 5000, 30000, 60000]
    publishedRetentionHours: 168
    failedRetentionHours: 720
    invalidSchemaAction: quarantine

postgres:
  host: coffee_postgres
  port: 5432
  sslMode: prefer
  maxConnections: 96
  reservedConnections: 32
  rolloutReplicas: 1

kafka:
  brokers: [kafka:9092]
  clientProtocol: SASL_SSL
  autoTopicCreation: false
  topics:
    catalogSnapshot:
      name: coffee.catalog.snapshot.v1
      partitions: 12
      retentionHours: 2160
      dlq: coffee.catalog.snapshot.v1.dlq
    catalogMapping:
      name: coffee.catalog.mapping.v2
      partitions: 12
      retentionHours: 2160
      dlq: coffee.catalog.mapping.v2.dlq
    ordersLifecycle:
      name: coffee.orders.lifecycle.v1
      partitions: 12
      retentionHours: 2160
      dlq: coffee.orders.lifecycle.v1.dlq
    aromaCommands:
      name: coffee.aroma.cart.commands.v1
      partitions: 24
      retentionHours: 168
      dlq: coffee.aroma.cart.commands.v1.dlq
    aromaEvents:
      name: coffee.aroma.cart.events.v1
      partitions: 24
      retentionHours: 720
      dlq: coffee.aroma.cart.events.v1.dlq
    realtimeInvalidate:
      name: coffee.realtime.invalidate.v1
      partitions: 24
      retentionHours: 1
      dlq: coffee.realtime.invalidate.v1.dlq
  delivery:
    producerRetries: 3
    maxMessageBytes: 1048576
    maxPartitions: 24
    maxInFlight: 4
    queueCapacity: 32
    sendTimeoutMs: 2000
    receiveTimeoutMs: 1000
    commitTimeoutMs: 2000
    revokeTimeoutMs: 2000
    shutdownTimeoutMs: 5000
    leaseMs: 30000
    retry: { baseMs: 1000, maxMs: 60000, maxAttempts: 12 }
    quarantine: { durable: owner-database, realtime: topic-dlq }

aroma:
  supplierRef: sup_00000000000000000000000001
  scopeRef: aroma-primary
  origin:
    scheme: https
    host: aromateacoffee.ru
    port: 443
  redirectsAllowed: false
  defaultPacking: Aroma

pricingPolicy:
  policyVersionRef: pvr_00000000000000000000000001
  version: '1'
  currency: RUB
  markupBasisPoints: 3000
  minimumMarginMinor: '0'
  quoteTtlSeconds: 900
  quantityScale: 3
  roundingMode: CEILING

telemetry:
  namespace: coffee-platform
  releaseDigest: development
  nginxStatusEndpoint: http://edge-nginx:8081/nginx_status
  collector:
    otlpEndpoint: http://otel-collector:4318
    healthEndpoint: http://otel-collector:13133
    metricsEndpoint: http://otel-collector:8888
    memoryLimitMiB: 256
    memorySpikeMiB: 64
    memoryCheckIntervalMs: 1000
    batchSize: 128
    batchTimeoutMs: 1000
    queueCapacity: 512
    queueConsumers: 2
    exportTimeoutMs: 2000
    retryInitialMs: 1000
    retryMaxMs: 5000
    retryWindowMs: 15000
    maxLogRecordBytes: 65536
  producer:
    queueCapacity: 256
    maxRecordBytes: 16384
    batchSize: 64
    batchIntervalMs: 1000
    exportTimeoutMs: 1000
    diagnosticIntervalMs: 10000
    flushTimeoutMs: 2000
  logging:
    maxSizeMiB: 8
    maxFiles: 3
  openObserve:
    endpoint: http://openobserve:5080
    organization: default
    bootstrapEmail: operations@coffee-platform.internal
    validationMarker: bootstrap-validation-placeholder
    telemetryEnabled: false
    mmdbDownloadEnabled: false
    modelPricingEnabled: false
    memoryLimitMiB: 512
    memTableMaxSizeMiB: 128
    maxFileSizeInMemoryMiB: 8
    maxFileSizeOnDiskMiB: 8
    maxFileRetentionSeconds: 30
    memPersistIntervalSeconds: 2
    streams:
      logs: platform_logs
      traces: platform_traces
      metrics: platform_metrics
    retentionDays: 3
    deleteFilesDelayMinutes: 1
    maxDiskBytes: 1073741824
    diskWatermarkPercent: 80
    compactionIntervalSeconds: 60
    jobCleanupWaitSeconds: 60
  alerts:
    version: 1
    evaluationIntervalMs: 60000
    notReady: {forMs: 300000, threshold: 0}
    consumerLag: {forMs: 300000, threshold: 0}
    outboxOldestAge: {forMs: 300000, threshold: 0}
    unknownOutcome: {forMs: 120000, threshold: 0}
    sseDropRate: {forMs: 300000, threshold: 0.05}

browserOidc: null

security:
  actorContext:
    algorithm: Ed25519
    activeKid: actor-v1
    previousKid: actor-v0
    maxAgeSeconds: 60
    clockSkewSeconds: 5
    overlapSeconds: 86400
    verificationKeys:
      actor-v1: ed25519-public-actor-v1
      actor-v0: ed25519-public-actor-v0
  catalogCursor:
    algorithm: Ed25519
    activeKid: cursor-v1
    previousKid: cursor-v0
    maxAgeSeconds: 86400
    clockSkewSeconds: 5
    overlapSeconds: 172800
    verificationKeys:
      cursor-v1: ed25519-public-cursor-v1
      cursor-v0: ed25519-public-cursor-v0
  customerCursor:
    algorithm: Ed25519
    activeKid: customer-cursor-v1
    previousKid: customer-cursor-v0
    maxAgeSeconds: 86400
    clockSkewSeconds: 5
    overlapSeconds: 172800
    previousKeyTrustUntilEpochSeconds: 1798761600
    verificationKeys:
      customer-cursor-v1: ed25519-public-customer-cursor-v1
      customer-cursor-v0: ed25519-public-customer-cursor-v0
  serviceTrustBundles:
    activeKid: transport-v1
    previousKid: transport-v0
    overlapHours: 12
    publicKeys:
      edge-gateway: {active: ed25519-public-edge-gateway-v1, previous: ed25519-public-edge-gateway-v0}
      api-public: {active: ed25519-public-api-public-v1, previous: ed25519-public-api-public-v0}
      api-internal: {active: ed25519-public-api-internal-v1, previous: ed25519-public-api-internal-v0}
      edge-nginx: {active: ed25519-public-edge-nginx-v1, previous: ed25519-public-edge-nginx-v0}
      customer-service: {active: ed25519-public-customer-service-v1, previous: ed25519-public-customer-service-v0}
      catalog-service: {active: ed25519-public-catalog-service-v1, previous: ed25519-public-catalog-service-v0}
      catalog-supplier-sync: {active: ed25519-public-catalog-supplier-sync-v1, previous: ed25519-public-catalog-supplier-sync-v0}
      catalog-activation-worker: {active: ed25519-public-catalog-activation-worker-v1, previous: ed25519-public-catalog-activation-worker-v0}
      pricing-service: {active: ed25519-public-pricing-service-v1, previous: ed25519-public-pricing-service-v0}
      orders-service: {active: ed25519-public-orders-service-v1, previous: ed25519-public-orders-service-v0}
      orders-aroma-preparation: {active: ed25519-public-orders-aroma-preparation-v1, previous: ed25519-public-orders-aroma-preparation-v0}
      aroma-observer: {active: ed25519-public-aroma-observer-v1, previous: ed25519-public-aroma-observer-v0}
      aroma-convergence: {active: ed25519-public-aroma-convergence-v1, previous: ed25519-public-aroma-convergence-v0}
      aroma-gateway: {active: ed25519-public-aroma-gateway-v1, previous: ed25519-public-aroma-gateway-v0}
      realtime-gateway: {active: ed25519-public-realtime-gateway-v1, previous: ed25519-public-realtime-gateway-v0}
  delegation:
    publicActor:
      issuer: api-public
      audience: owner-service
      maxTtlSeconds: 60
      clockSkewSeconds: 5
    internalService:
      issuer: api-internal
      maxTtlRule: remaining-request-deadline-plus-5s-skew
      gatewayMutationCaller: aroma-convergence

nginxTransport:
  listen: 8443
  publicHost: localhost
  upstreams:
    edge: {host: edge-gateway, port: 4000, serverName: edge-gateway.development.svc.coffee-platform.internal}
    apiPublic: {host: api-public, port: 4050, serverName: api-public.development.svc.coffee-platform.internal}
    realtime: {host: realtime-gateway, port: 4401, serverName: realtime-gateway.development.svc.coffee-platform.internal}
  tls:
    bufferBytes: 4096
    sessionCacheMiB: 4
    sessionTimeoutMinutes: 5
    publicCertificate: /run/secrets/edge-nginx/public.crt
    publicPrivateKey: /run/secrets/edge-nginx/public.key
    upstreamCa: /run/secrets/edge-nginx/upstream-ca.crt
    clientCertificate: /run/secrets/edge-nginx/client.crt
    clientPrivateKey: /run/secrets/edge-nginx/client.key
  limits:
    bodyBytes: 1048576
    headerBytes: 16384
    targetBytes: 2048
    requestPoolBytes: 2048
    apiConnectSeconds: 1
    apiReadSeconds: 6
    apiSendSeconds: 6
    authConnectSeconds: 1
    authReadSeconds: 1
    sseReadSeconds: 45
    workerProcesses: 1
    workerConnections: 2048
    sseAdmissionConnections: 512
    apiAdmissionConnections: 384
    authAdmissionConnections: 320

services:
  edge-gateway:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4000}
    health: &health
      livePath: /health/live
      readyPath: /health/ready
      metricsPath: /metrics
      intervalMs: 5000
      timeoutMs: 1000
      startupGraceMs: 30000
      failureThreshold: 3
      successThreshold: 1
    deadlineMs: 5000
    deadlineProfiles: {defaultMs: 5000}
    concurrency: 500
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs: [edge.oidcClientSecret, security.actorContextEdgeSigningPrivateKey, security.serviceTransportKeys.edge-gateway, telemetry.exporterToken]
    optionalSecretRefs: [edge.tlsCaBundle]
    permissions: {manifest: config/permissions/edge-gateway.json, net: [], fsRead: [/app/config/platform.yaml, /app/dist], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  api-public:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4050}
    health: *health
    deadlineMs: 4500
    deadlineProfiles: {defaultMs: 4500}
    concurrency: 400
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound: [customer-service:4101, catalog-service:4102, pricing-service:4103, orders-service:4104]
    secretRefs: [security.apiPublicDelegationSigningPrivateKey, security.actorContextEdgeVerificationPublicKeys, security.serviceTransportKeys.api-public, telemetry.exporterToken]
    permissions: {manifest: config/permissions/api-public.json, net: [customer-service:4101, catalog-service:4102, pricing-service:4103, orders-service:4104], fsRead: [/app/config/platform.yaml, /app/dist], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  api-internal:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4051}
    health: *health
    deadlineMs: null
    deadlineProfiles: {defaultMs: null}
    concurrency: 300
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound: [customer-service:4101, catalog-service:4102, pricing-service:4103, aroma-gateway:4301]
    secretRefs: [security.apiInternalDelegationSigningPrivateKey, security.serviceVerificationKeys.orders-service, security.serviceVerificationKeys.pricing-service, security.serviceTransportKeys.api-internal, telemetry.exporterToken]
    permissions: {manifest: config/permissions/api-internal.json, net: [customer-service:4101, catalog-service:4102, pricing-service:4103, aroma-gateway:4301], fsRead: [/app/config/platform.yaml, /app/dist], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  customer-service:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4101}
    health: *health
    deadlineMs: 2000
    deadlineProfiles: {defaultMs: 2000}
    concurrency: 100
    replicas: 1
    dbPool: {max: 8, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_customer
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs: [postgres.customer, security.customerCursorSigningPrivateKey, security.customerCursorVerificationPublicKeys, security.delegationVerificationKeys.api-public, security.delegationVerificationKeys.api-internal, security.serviceTransportKeys.customer-service, telemetry.exporterToken]
    permissions: {manifest: config/permissions/customer-service.json, net: [coffee_postgres:5432], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  catalog-service:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4102}
    health: *health
    deadlineMs: 2000
    deadlineProfiles: {defaultMs: 2000}
    concurrency: 150
    replicas: 1
    catalogSnapshotProof: {maxAgeMs: 7200000}
    dbPool: {max: 8, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_catalog
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs: [postgres.catalogApi, security.catalogCursorSigningPrivateKey, security.delegationVerificationKeys.api-public, security.delegationVerificationKeys.api-internal, security.serviceTransportKeys.catalog-service, telemetry.exporterToken]
    permissions: {manifest: config/permissions/catalog-service.json, net: [coffee_postgres:5432], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  catalog-supplier-sync:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4201}
    health: *health
    deadlineMs: 900000
    deadlineProfiles: {defaultMs: 900000}
    concurrency: 1
    replicas: 1
    scheduler: {intervalMs: 3600000, startupImport: true, overlapPolicy: skip}
    dbPool: {max: 4, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_catalog
    kafka: { producers: [], consumers: [] }
    outbound: [api-internal:4051]
    secretRefs: [postgres.catalogImport, security.serviceTransportKeys.catalog-supplier-sync, telemetry.exporterToken]
    permissions: {manifest: config/permissions/catalog-supplier-sync.json, net: [coffee_postgres:5432, api-internal:4051], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  catalog-activation-worker:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4202}
    health: *health
    deadlineMs: 5000
    deadlineProfiles: {defaultMs: 5000}
    concurrency: 1
    replicas: 1
    dbPool: {max: 4, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_catalog
    kafka:
      {
        producers: [coffee.catalog.snapshot.v1, coffee.catalog.mapping.v2],
        consumers: [],
      }
    outbound: [api-internal:4051]
    secretRefs: [postgres.catalogActivate, kafka.catalog, security.serviceTransportKeys.catalog-activation-worker, telemetry.exporterToken]
    permissions: {manifest: config/permissions/catalog-activation-worker.json, net: [coffee_postgres:5432, kafka:9092, api-internal:4051], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  pricing-service:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4103}
    health: *health
    deadlineMs: 5000
    deadlineProfiles: {defaultMs: 5000}
    concurrency: 100
    replicas: 1
    dbPool: {max: 8, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_pricing
    kafka: { producers: [], consumers: [] }
    outbound: [api-internal:4051]
    secretRefs: [postgres.pricing, security.pricingServiceDelegationSigningPrivateKey, security.delegationVerificationKeys.api-public, security.delegationVerificationKeys.api-internal, security.serviceTransportKeys.pricing-service, telemetry.exporterToken]
    permissions: {manifest: config/permissions/pricing-service.json, net: [coffee_postgres:5432, api-internal:4051], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  orders-service:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4104}
    health: *health
    deadlineMs: 5000
    deadlineProfiles: {defaultMs: 5000}
    concurrency: 150
    replicas: 1
    dbPool: {max: 4, maxWaiting: 100, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_orders
    kafka:
      {
        producers:
          [
            coffee.orders.lifecycle.v1,
            coffee.aroma.cart.commands.v1,
            coffee.realtime.invalidate.v1,
          ],
        consumers: [],
      }
    outbound: [api-internal:4051]
    secretRefs: [postgres.ordersService, kafka.orders, security.ordersServiceDelegationSigningPrivateKey, security.delegationVerificationKeys.api-public, security.serviceTransportKeys.orders-service, telemetry.exporterToken]
    permissions: {manifest: config/permissions/orders-service.json, net: [coffee_postgres:5432, api-internal:4051, kafka:9092], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  orders-aroma-preparation:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4203}
    health: *health
    deadlineMs: 5000
    deadlineProfiles: {defaultMs: 5000}
    concurrency: 16
    replicas: 1
    aromaPreparation: {pollIntervalMs: 1000, batchSize: 100, maxOrders: 10000, maxLines: 10000}
    dbPool: {max: 4, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_orders
    kafka:
      producers: [coffee.aroma.cart.commands.v1, coffee.realtime.invalidate.v1]
      consumers:
        - {
            groupId: orders-catalog-mapping-v2,
            topics: [coffee.catalog.mapping.v2],
            processing: durable,
          }
        - {
            groupId: orders-aroma-preparation-v1,
            topics: [coffee.orders.lifecycle.v1],
            processing: durable,
          }
        - {
            groupId: orders-aroma-projection-v1,
            topics: [coffee.aroma.cart.events.v1],
            processing: durable,
          }
    outbound: []
    secretRefs: [postgres.ordersPreparation, kafka.orders, security.serviceTransportKeys.orders-aroma-preparation, telemetry.exporterToken]
    permissions: {manifest: config/permissions/orders-aroma-preparation.json, net: [coffee_postgres:5432, kafka:9092], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  aroma-observer:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4204}
    health: *health
    deadlineMs: 15000
    deadlineProfiles: {defaultMs: 15000}
    concurrency: 4
    replicas: 1
    aromaObservation: {pollIntervalMs: 1000, intervalMs: 5000, leaseMs: 30000, maxSnapshotAgeMs: 15000, maxLines: 10000, maxResponseBytes: 2097152}
    dbPool: {max: 4, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_orders
    kafka: { producers: [coffee.aroma.cart.events.v1], consumers: [] }
    outbound: [api-internal:4051]
    secretRefs: [postgres.aromaObserver, kafka.orders, security.serviceTransportKeys.aroma-observer, telemetry.exporterToken]
    permissions: {manifest: config/permissions/aroma-observer.json, net: [coffee_postgres:5432, api-internal:4051, kafka:9092], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: false

  aroma-convergence:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4205}
    health: *health
    deadlineMs: 30000
    deadlineProfiles: {defaultMs: 30000}
    concurrency: 4
    replicas: 1
    mutationsEnabled: false
    aromaConvergence: {pollIntervalMs: 1000, leaseMs: 30000, heartbeatIntervalMs: 10000, providerDeadlineMs: 10000, safetyMarginMs: 5000, retryBackoffMs: 5000, maxSnapshotAgeMs: 15000, maxLines: 10000, maxResponseBytes: 2097152}
    dbPool: {max: 4, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_orders
    kafka:
      producers: [coffee.aroma.cart.events.v1, coffee.realtime.invalidate.v1]
      consumers:
        - {
            groupId: aroma-convergence-v1,
            topics: [coffee.aroma.cart.commands.v1],
            processing: durable,
          }
    outbound: [api-internal:4051]
    secretRefs: [postgres.aromaConvergence, kafka.orders, security.serviceTransportKeys.aroma-convergence, telemetry.exporterToken]
    permissions: {manifest: config/permissions/aroma-convergence.json, net: [coffee_postgres:5432, api-internal:4051, kafka:9092], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: true

  aroma-gateway:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4301}
    health: *health
    deadlineMs: 10000
    deadlineProfiles: {defaultMs: 10000, readMs: 900000, cartMs: 10000, mutationMs: 10000}
    concurrency: 8
    replicas: 1
    dbPool: {max: 8, checkoutTimeoutMs: 250, lockTimeoutMs: 250, interactiveStatementTimeoutMs: 1500, backgroundStatementTimeoutMs: 5000, terminalTimeoutMs: 2000, transactionTimeoutMs: 10000, idleTimeoutMs: 30000, maxLifetimeMs: 1800000}
    database: coffee_platform_integration
    kafka: { producers: [], consumers: [] }
    outbound: [aroma.origin.host:443]
    secretRefs: [postgres.aromaGateway, aroma.email, aroma.password, aroma.sessionEncryptionKey, aroma.catalogIdentityKeyV1, security.delegationVerificationKeys.api-internal, security.serviceTransportKeys.aroma-gateway, telemetry.exporterToken]
    permissions: {manifest: config/permissions/aroma-gateway.json, net: [coffee_postgres:5432, aroma.origin.host:443], fsRead: [/app/config/platform.yaml, /app/dist, /run/secrets/coffee-platform.yaml], fsWrite: [], childProcess: false, workers: false}
    mutationCapability: true

  realtime-gateway:
    transportMode: mtls
    listen: {host: 0.0.0.0, port: 4401}
    health: *health
    deadlineMs: null
    deadlineProfiles: {defaultMs: null}
    concurrency: 512
    replicas: 1
    dbPool: null
    database: null
    realtime:
      shutdownGraceMs: 20000
      maxConnections: 512
      queueMaxRecords: 64
      queueMaxBytes: 262144
      totalQueueMaxRecords: 262144
      totalQueueMaxBytes: 67108864
      ringMaxRecords: 10000
      ringMaxBytes: 16777216
      ringMaxAgeMs: 300000
      coalesceMs: 250
      writeTimeoutMs: 5000
      heartbeatMs: 15000
      authCheckMs: 30000
      maxEventDataBytes: 2048
      rssBudgetBytes: 536870912
      fdBudget: 12288
