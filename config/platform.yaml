$schema: ./platform.schema.json
schemaVersion: 1
environment: development
toolchainRef: config/toolchain-versions.json
verification:
  aromaSandbox: null
  realtimeQualification:
    budgetSeconds: 2700
    maximumAgeSeconds: 7200
  securityScan:
    enabled: true
    cpu: 2
    memoryMiB: 2048
    parallel: 1
    minimumFreeDiskGiB: 20
    maximumDatabaseAgeHours: 24
    approvedFixed: [CVE-2026-21728, CVE-2026-28377]
    egressRepositories:
      - ghcr.io/aquasecurity/trivy-db
      - ghcr.io/aquasecurity/trivy-java-db
  databaseIsolation:
    enabled: false
  kafkaNamespaceIsolation: false
  unitCoverage:
    thresholds:
      lines: 90
      functions: 90
      branches: 85
    criticalModules:
      - id: platform-config
        sourceRoots: [packages/platform-config/src]
        coverageRoots: [packages/platform-config/dist]
        format: js
      - id: trusted-config-bootstrap
        sourceRoots: [tools/config-bootstrap]
        coverageRoots: [tools/config-bootstrap]
        format: mjs
      - id: platform-runtime
        sourceRoots: [packages/platform-runtime/src]
        coverageRoots: [packages/platform-runtime/dist]
        format: js
      - id: persistence-foundation
        sourceRoots:
          [packages/platform-database/src, packages/platform-migrations/src]
        coverageRoots:
          [packages/platform-database/dist, packages/platform-migrations/dist]
        format: js
      - id: durable-delivery
        sourceRoots:
          [
            packages/platform-outbox/src,
            packages/platform-inbox/src,
            packages/platform-idempotency/src,
          ]
        coverageRoots:
          [
            packages/platform-outbox/dist,
            packages/platform-inbox/dist,
            packages/platform-idempotency/dist,
          ]
        format: js
      - id: kafka-runtime
        sourceRoots: [packages/platform-kafka-runtime/src]
        coverageRoots: [packages/platform-kafka-runtime/dist]
        format: js
      - id: security-trust
        sourceRoots:
          [packages/platform-security/src, packages/platform-http/src]
        coverageRoots:
          [packages/platform-security/dist, packages/platform-http/dist]
        format: js
      - id: customer-service
        sourceRoots: [apps/customer-service/src]
        coverageRoots: [apps/customer-service/dist]
        format: js
      - id: catalog-service
        sourceRoots:
          [
            apps/catalog-service/src,
            apps/catalog-supplier-sync/src,
            apps/catalog-activation-worker/src,
          ]
        coverageRoots:
          [
            apps/catalog-service/dist,
            apps/catalog-supplier-sync/dist,
            apps/catalog-activation-worker/dist,
          ]
        format: js
      - id: pricing-service
        sourceRoots: [apps/pricing-service/src]
        coverageRoots: [apps/pricing-service/dist]
        format: js
      - id: orders-service
        sourceRoots: [apps/orders-service/src]
        coverageRoots: [apps/orders-service/dist]
        format: js
      - id: aroma-convergence
        sourceRoots: [apps/aroma-convergence/src]
        coverageRoots: [apps/aroma-convergence/dist]
        format: js
      - id: aroma-preparation
        sourceRoots: [apps/orders-aroma-preparation/src]
        coverageRoots: [apps/orders-aroma-preparation/dist]
        format: js
      - id: aroma-observer
        sourceRoots: [apps/aroma-observer/src]
        coverageRoots: [apps/aroma-observer/dist]
        format: js
      - id: aroma-gateway
        sourceRoots: [apps/aroma-gateway/src]
        coverageRoots: [apps/aroma-gateway/dist]
        format: js
      - id: public-api-trust
        sourceRoots:
          [
            apps/api-public/src,
            apps/api-internal/src,
            apps/edge-gateway/src,
            apps/realtime-gateway/src,
          ]
        coverageRoots:
          [
            apps/api-public/dist,
            apps/api-internal/dist,
            apps/edge-gateway/dist,
            apps/realtime-gateway/dist,
          ]
        format: js
    testFiles:
      - packages/platform-testing/test/platform-packages.test.mjs
      - tests/config/platform-config.test.mjs
      - tests/config/observability-bootstrap.test.mjs
      - tests/runtime/lifecycle.test.mjs
      - tests/runtime/platform-http.test.mjs
      - tests/runtime/permissions.test.mjs
      - tests/kafka/runtime.test.mjs
      - tests/edge-auth/oidc-auth.test.mjs
      - tests/edge-auth/routes.test.mjs
      - tests/customer/customer-http.test.mjs
      - tests/catalog/ingestion.test.mjs
      - tests/catalog/catalog-owner.test.mjs
      - tests/catalog/catalog-root.test.mjs
      - tests/catalog/stream.test.mjs
      - tests/catalog/activation-binding-client.test.mjs
      - tests/catalog/activation-contracts.test.mjs
      - tests/catalog/activation-events.test.mjs
      - tests/catalog/activation-identity.test.mjs
      - tests/catalog/activation-validation.test.mjs
      - tests/pricing/pricing-formula.test.mjs
      - tests/orders/order-card.test.mjs
      - tests/orders/contract.test.mjs
      - tests/orders/order-contribution.test.mjs
      - tests/orders/row-schemas.test.mjs
      - tests/aroma/provider-decoder.test.mjs
      - tests/aroma/provider-http.test.mjs
      - tests/aroma/provider-session.test.mjs
      - tests/aroma/cart-reader.test.mjs
      - tests/aroma/api-internal-operations.test.mjs
      - tests/aroma/safe-read-http.test.mjs
      - tests/aroma/scoping-provenance.test.mjs
      - tests/aroma/source-identity.test.mjs
      - tests/aroma/convergence-domain.test.mjs
      - tests/aroma/worker-gateway-client.test.mjs
      - packages/platform-security/test/actor-context.test.mjs
      - verification/launch/v1/scenarios/backup-restore.test.mjs
      - tests/pricing/create-pricing-quote.test.mjs
      - tests/pricing/catalog-client.test.mjs
      - tests/pricing/pricing-http.test.mjs
      - tests/orders/owner-http.test.mjs
      - tests/orders/upstream-clients.test.mjs
      - tests/customer/customer-normalization.test.mjs
      - tests/aroma/provider-cart-mutator.test.mjs
      - tests/aroma/gateway-operations-http.test.mjs
      - tests/pricing/quote-proof.test.mjs
      - tests/pricing/pricing-observability.test.mjs
      - tests/pricing/pricing-public-api.test.mjs
      - tests/pricing/pricing-internal-api.test.mjs
      - tests/orders/public-api.test.mjs
      - tests/orders/security.test.mjs
      - tests/orders/observability.test.mjs
      - tests/aroma/provider-catalog-source.test.mjs
      - tests/aroma/gateway-production-composition.test.mjs
      - tests/aroma/binding-http.test.mjs
      - tests/aroma/catalog-export.test.mjs
      - tests/edge-auth/operations.test.mjs
      - tests/realtime/auth.test.mjs
      - tests/realtime/contract.test.mjs
      - tests/realtime/replay.test.mjs
      - tests/realtime/backpressure.test.mjs

platform:
  publicBaseUrl: https://localhost:8443
  shutdownGraceMs: 30000
  requestDeadlineMs: 5000
  bodyLimitBytes: 1048576

  health:
    livePath: /health/live
    readyPath: /health/ready
    metricsPath: /metrics
    intervalMs: 5000
    timeoutMs: 1000
    startupGraceMs: 30000
    failureThreshold: 3
    successThreshold: 1
  outbox:
    pollIntervalMs: 250
    batchSize: 100
    claimLeaseMs: 30000
    maxAttempts: 12
    backoffMs: [1000, 5000, 30000, 60000]
    publishedRetentionHours: 168
    failedRetentionHours: 720
    invalidSchemaAction: quarantine

postgres:
  host: coffee_postgres
  bootstrapUsername: coffeeuser
  port: 5432
  sslMode: prefer
  maxConnections: 96
  reservedConnections: 32
  rolloutReplicas: 1

kafka:
  brokers: [kafka:9092]
  clientProtocol: SASL_SSL
  autoTopicCreation: false
  topics:
    catalogSnapshot:
      name: coffee.catalog.snapshot.v1
      partitions: 12
      retentionHours: 2160
      dlq: coffee.catalog.snapshot.v1.dlq
    catalogMapping:
      name: coffee.catalog.mapping.v2
      partitions: 12
      retentionHours: 2160
      dlq: coffee.catalog.mapping.v2.dlq
    ordersLifecycle:
      name: coffee.orders.lifecycle.v1
      partitions: 12
      retentionHours: 2160
      dlq: coffee.orders.lifecycle.v1.dlq
    aromaCommands:
      name: coffee.aroma.cart.commands.v1
      partitions: 24
      retentionHours: 168
      dlq: coffee.aroma.cart.commands.v1.dlq
    aromaEvents:
      name: coffee.aroma.cart.events.v1
      partitions: 24
      retentionHours: 720
      dlq: coffee.aroma.cart.events.v1.dlq
    realtimeInvalidate:
      name: coffee.realtime.invalidate.v1
      partitions: 24
      retentionHours: 1
      dlq: coffee.realtime.invalidate.v1.dlq
  delivery:
    producerRetries: 3
    maxMessageBytes: 1048576
    maxPartitions: 24
    maxInFlight: 4
    queueCapacity: 32
    sendTimeoutMs: 2000
    receiveTimeoutMs: 1000
    commitTimeoutMs: 2000
    revokeTimeoutMs: 2000
    shutdownTimeoutMs: 5000
    leaseMs: 30000
    retry: { baseMs: 1000, maxMs: 60000, maxAttempts: 12 }
    quarantine: { durable: owner-database, realtime: topic-dlq }

aroma:
  supplierRef: sup_00000000000000000000000001
  scopeRef: aroma-primary
  origin:
    scheme: https
    host: aromateacoffee.ru
    port: 443
  redirectsAllowed: false
  defaultPacking: Aroma

pricingPolicy:
  policyVersionRef: pvr_00000000000000000000000001
  version: "1"
  currency: RUB
  markupBasisPoints: 3000
  minimumMarginMinor: "0"
  quoteTtlSeconds: 900
  quantityScale: 3
  roundingMode: CEILING

telemetry:
  namespace: coffee-platform
  releaseDigest: development
  nginxStatusEndpoint: http://edge-nginx:8081/nginx_status
  collector:
    otlpEndpoint: http://otel-collector:4318
    healthEndpoint: http://otel-collector:13133
    memoryLimitMiB: 256
    memorySpikeMiB: 64
    containerMemoryMiB: 1024
    memoryCheckIntervalMs: 1000
    batchSize: 128
    batchTimeoutMs: 1000
    queueCapacity: 2048
    queueConsumers: 2
    exportTimeoutMs: 2000
    retryInitialMs: 1000
    retryMaxMs: 5000
    retryWindowMs: 15000
    maxLogRecordBytes: 65536
  producer:
    queueCapacity: 256
    maxRecordBytes: 16384
    batchSize: 64
    batchIntervalMs: 1000
    exportTimeoutMs: 1000
    diagnosticIntervalMs: 10000
    flushTimeoutMs: 2000
  logging:
    maxSizeMiB: 8
    maxFiles: 3
  diskWatermarkPercent: 80
  externalReportingEnabled: false
  grafana:
    {
      endpoint: http://grafana:3000,
      memoryLimitMiB: 512,
      maxDiskBytes: 1073741824,
    }
  loki:
    {
      endpoint: http://loki:3100,
      memoryLimitMiB: 512,
      maxDiskBytes: 1073741824,
      retentionDays: 3,
    }
  prometheus:
    {
      endpoint: http://prometheus:9090,
      memoryLimitMiB: 512,
      maxDiskBytes: 1073741824,
      retentionDays: 3,
      outOfOrderWindowMs: 1800000,
    }
  tempo:
    {
      endpoint: http://tempo:3200,
      otlpEndpoint: http://tempo:4318,
      memoryLimitMiB: 768,
      maxDiskBytes: 1073741824,
      retentionDays: 3,
      finishOnShutdownTimeoutMs: 10000,
    }
  alerts:
    version: 1
    evaluationIntervalMs: 60000
    notificationEndpoint: http://alert-sink:9091/alerts
    diskUsage: { forMs: 0 }
    sinkMemoryMiB: 128
    notReady: { forMs: 300000, threshold: 0 }
    consumerLag: { forMs: 300000, threshold: 0 }
    outboxOldestAge: { forMs: 300000, threshold: 0 }
    unknownOutcome: { forMs: 120000, threshold: 0 }
    sseDropRate: { forMs: 300000, threshold: 0.05 }

browserOidc: null

security:
  actorContext:
    algorithm: Ed25519
    activeKid: actor-v1
    previousKid: actor-v0
    maxAgeSeconds: 60
    clockSkewSeconds: 5
    overlapSeconds: 86400
    verificationKeys:
      actor-v1: ed25519-public-actor-v1
      actor-v0: ed25519-public-actor-v0
  catalogCursor:
    algorithm: Ed25519
    activeKid: cursor-v1
    previousKid: cursor-v0
    maxAgeSeconds: 86400
    clockSkewSeconds: 5
    overlapSeconds: 172800
    verificationKeys:
      cursor-v1: ed25519-public-cursor-v1
      cursor-v0: ed25519-public-cursor-v0
  customerCursor:
    algorithm: Ed25519
    activeKid: customer-cursor-v1
    previousKid: customer-cursor-v0
    maxAgeSeconds: 86400
    clockSkewSeconds: 5
    overlapSeconds: 172800
    previousKeyTrustUntilEpochSeconds: 1798761600
    verificationKeys:
      customer-cursor-v1: ed25519-public-customer-cursor-v1
      customer-cursor-v0: ed25519-public-customer-cursor-v0
  serviceTrustBundles:
    activeKid: transport-v1
    previousKid: transport-v0
    overlapHours: 12
    publicKeys:
      edge-gateway:
        {
          active: ed25519-public-edge-gateway-v1,
          previous: ed25519-public-edge-gateway-v0,
        }
      api-public:
        {
          active: ed25519-public-api-public-v1,
          previous: ed25519-public-api-public-v0,
        }
      api-internal:
        {
          active: ed25519-public-api-internal-v1,
          previous: ed25519-public-api-internal-v0,
        }
      edge-nginx:
        {
          active: ed25519-public-edge-nginx-v1,
          previous: ed25519-public-edge-nginx-v0,
        }
      customer-service:
        {
          active: ed25519-public-customer-service-v1,
          previous: ed25519-public-customer-service-v0,
        }
      catalog-service:
        {
          active: ed25519-public-catalog-service-v1,
          previous: ed25519-public-catalog-service-v0,
        }
      catalog-supplier-sync:
        {
          active: ed25519-public-catalog-supplier-sync-v1,
          previous: ed25519-public-catalog-supplier-sync-v0,
        }
      catalog-activation-worker:
        {
          active: ed25519-public-catalog-activation-worker-v1,
          previous: ed25519-public-catalog-activation-worker-v0,
        }
      pricing-service:
        {
          active: ed25519-public-pricing-service-v1,
          previous: ed25519-public-pricing-service-v0,
        }
      orders-service:
        {
          active: ed25519-public-orders-service-v1,
          previous: ed25519-public-orders-service-v0,
        }
      orders-aroma-preparation:
        {
          active: ed25519-public-orders-aroma-preparation-v1,
          previous: ed25519-public-orders-aroma-preparation-v0,
        }
      aroma-observer:
        {
          active: ed25519-public-aroma-observer-v1,
          previous: ed25519-public-aroma-observer-v0,
        }
      aroma-convergence:
        {
          active: ed25519-public-aroma-convergence-v1,
          previous: ed25519-public-aroma-convergence-v0,
        }
      aroma-gateway:
        {
          active: ed25519-public-aroma-gateway-v1,
          previous: ed25519-public-aroma-gateway-v0,
        }
      realtime-gateway:
        {
          active: ed25519-public-realtime-gateway-v1,
          previous: ed25519-public-realtime-gateway-v0,
        }
  delegation:
    publicActor:
      issuer: api-public
      audience: owner-service
      maxTtlSeconds: 60
      clockSkewSeconds: 5
    internalService:
      issuer: api-internal
      maxTtlRule: remaining-request-deadline-plus-5s-skew
      gatewayMutationCaller: aroma-convergence

nginxTransport:
  listen: 8443
  publicHost: localhost
  upstreams:
    edge:
      {
        host: edge-gateway,
        port: 4000,
        serverName: edge-gateway.development.svc.coffee-platform.internal,
      }
    apiPublic:
      {
        host: api-public,
        port: 4050,
        serverName: api-public.development.svc.coffee-platform.internal,
      }
    realtime:
      {
        host: realtime-gateway,
        port: 4401,
        serverName: realtime-gateway.development.svc.coffee-platform.internal,
      }
  tls:
    bufferBytes: 4096
    sessionCacheMiB: 4
    sessionTimeoutMinutes: 5
    publicCertificate: /run/secrets/edge-nginx/public.crt
    publicPrivateKey: /run/secrets/edge-nginx/public.key
    upstreamCa: /run/secrets/edge-nginx/upstream-ca.crt
    clientCertificate: /run/secrets/edge-nginx/client.crt
    clientPrivateKey: /run/secrets/edge-nginx/client.key
  limits:
    bodyBytes: 1048576
    headerBytes: 16384
    targetBytes: 2048
    requestPoolBytes: 2048
    apiConnectSeconds: 1
    apiReadSeconds: 6
    apiSendSeconds: 6
    authConnectSeconds: 1
    authReadSeconds: 1
    sseReadSeconds: 45
    workerProcesses: 1
    workerConnections: 2048
    sseAdmissionConnections: 512
    apiAdmissionConnections: 384
    authAdmissionConnections: 320

services:
  edge-gateway:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4000 }
    health: &health
      livePath: /health/live
      readyPath: /health/ready
      metricsPath: /metrics
      intervalMs: 5000
      timeoutMs: 1000
      startupGraceMs: 30000
      failureThreshold: 3
      successThreshold: 1
    deadlineMs: 5000
    deadlineProfiles: { defaultMs: 5000 }
    concurrency: 500
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs:
      [
        edge.oidcClientSecret,
        security.actorContextEdgeSigningPrivateKey,
        security.serviceTransportKeys.edge-gateway,
        telemetry.exporterToken,
      ]
    optionalSecretRefs: [edge.tlsCaBundle]
    permissions:
      {
        manifest: config/permissions/edge-gateway.json,
        net: [],
        fsRead: [/app/config/platform.yaml, /app/dist],
        fsWrite: [],
        childProcess: false,
        workers: false,
      }
    mutationCapability: false

  api-public:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4050 }
    health: *health
    deadlineMs: 4500
    deadlineProfiles: { defaultMs: 4500 }
    concurrency: 400
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound:
      [
        customer-service:4101,
        catalog-service:4102,
        pricing-service:4103,
        orders-service:4104,
      ]
    secretRefs:
      [
        security.apiPublicDelegationSigningPrivateKey,
        security.actorContextEdgeVerificationPublicKeys,
        security.serviceTransportKeys.api-public,
        telemetry.exporterToken,
      ]
    permissions:
      {
        manifest: config/permissions/api-public.json,
        net:
          [
            customer-service:4101,
            catalog-service:4102,
            pricing-service:4103,
            orders-service:4104,
          ],
        fsRead: [/app/config/platform.yaml, /app/dist],
        fsWrite: [],
        childProcess: false,
        workers: false,
      }
    mutationCapability: false

  api-internal:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4051 }
    health: *health
    deadlineMs: null
    deadlineProfiles: { defaultMs: null }
    concurrency: 300
    replicas: 1
    dbPool: null
    database: null
    kafka: { producers: [], consumers: [] }
    outbound:
      [
        customer-service:4101,
        catalog-service:4102,
        pricing-service:4103,
        aroma-gateway:4301,
      ]
    secretRefs:
      [
        security.apiInternalDelegationSigningPrivateKey,
        security.serviceVerificationKeys.orders-service,
        security.serviceVerificationKeys.pricing-service,
        security.serviceTransportKeys.api-internal,
        telemetry.exporterToken,
      ]
    permissions:
      {
        manifest: config/permissions/api-internal.json,
        net:
          [
            customer-service:4101,
            catalog-service:4102,
            pricing-service:4103,
            aroma-gateway:4301,
          ],
        fsRead: [/app/config/platform.yaml, /app/dist],
        fsWrite: [],
        childProcess: false,
        workers: false,
      }
    mutationCapability: false

  customer-service:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4101 }
    health: *health
    deadlineMs: 2000
    deadlineProfiles: { defaultMs: 2000 }
    concurrency: 100
    replicas: 1
    dbPool:
      {
        max: 8,
        checkoutTimeoutMs: 250,
        lockTimeoutMs: 250,
        interactiveStatementTimeoutMs: 1500,
        backgroundStatementTimeoutMs: 5000,
        terminalTimeoutMs: 2000,
        transactionTimeoutMs: 10000,
        idleTimeoutMs: 30000,
        maxLifetimeMs: 1800000,
      }
    database: coffee_platform_customer
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs:
      [
        postgres.customer,
        security.customerCursorSigningPrivateKey,
        security.customerCursorVerificationPublicKeys,
        security.delegationVerificationKeys.api-public,
        security.delegationVerificationKeys.api-internal,
        security.serviceTransportKeys.customer-service,
        telemetry.exporterToken,
      ]
    permissions:
      {
        manifest: config/permissions/customer-service.json,
        net: [coffee_postgres:5432],
        fsRead:
          [
            /app/config/platform.yaml,
            /app/dist,
            /run/secrets/coffee-platform.yaml,
          ],
        fsWrite: [],
        childProcess: false,
        workers: false,
      }
    mutationCapability: false

  catalog-service:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4102 }
    health: *health
    deadlineMs: 2000
    deadlineProfiles: { defaultMs: 2000 }
    concurrency: 150
    replicas: 1
    catalogSnapshotProof: { maxAgeMs: 7200000 }
    dbPool:
      {
        max: 8,
        checkoutTimeoutMs: 250,
        lockTimeoutMs: 250,
        interactiveStatementTimeoutMs: 1500,
        backgroundStatementTimeoutMs: 5000,
        terminalTimeoutMs: 2000,
        transactionTimeoutMs: 10000,
        idleTimeoutMs: 30000,
        maxLifetimeMs: 1800000,
      }
    database: coffee_platform_catalog
    kafka: { producers: [], consumers: [] }
    outbound: []
    secretRefs:
      [
        postgres.catalogApi,
        security.catalogCursorSigningPrivateKey,
        security.delegationVerificationKeys.api-public,
        security.delegationVerificationKeys.api-internal,
        security.serviceTransportKeys.catalog-service,
        telemetry.exporterToken,
      ]
    permissions:
      {
        manifest: config/permissions/catalog-service.json,
        net: [coffee_postgres:5432],
        fsRead:
          [
            /app/config/platform.yaml,
            /app/dist,
            /run/secrets/coffee-platform.yaml,
          ],
        fsWrite: [],
        childProcess: false,
        workers: false,
      }
    mutationCapability: false

  catalog-supplier-sync:
    transportMode: mtls
    listen: { host: 0.0.0.0, port: 4201 }
    health: *health
    deadlineMs: 900000
    deadlineProfiles: { defaultMs: 900000 }
    concurrency: 1
    replicas: 1
    scheduler: { intervalMs: 3600000, startupImport: true, overlapPolicy: skip }
    dbPool:
      {
        max: 4,
        checkoutTimeoutMs: 250,
        lockTimeoutMs: 250,
        interactiveStatementTimeoutMs: 1500,
        backgroundStatementTimeoutMs: 5000,
        terminalTimeoutMs: 2000,
        transactionTimeoutMs: 10000,
        idleTimeoutMs: 30000,
        maxLifetimeMs: 1800000,
      }
    database: coffee_platform_catalog
    kafka: { producers: [], consumers: [] }
    outbound: [api-internal:4051]
    secretRefs:
      [
        postgres.catalogImport,
        security.serviceTransportKeys.catalog-supplier-sync,
        telemetry.exporterToken,
      ]
    permissions:
      {
